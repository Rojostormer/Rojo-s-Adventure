<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROJO'S ADVENTURE - NEO-GEO MVS EDITION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--panel:#12121c;--panel2:#1a1a28;--gold:#ffcc00;--neored:#ff0033;
  --neoblue:#00d9ff;--neogreen:#00ff66;--neopurple:#d000ff;--neoorange:#ff6600;
  --text:#ffffff;--muted:#9090b0;--good:#00ff66;--bad:#ff0033;--blue:#00d9ff;
  --purple:#d000ff;--orange:#ff6600;--cyan:#00f0ff;--panel-border:#ffcc00;--panel-border2:#3d3d5c
}
*{box-sizing:border-box}
html{image-rendering:pixelated}
body{margin:0;background:var(--bg);color:var(--text);font-family:'VT323',ui-monospace,Consolas,monospace;font-size:18px;overflow-x:hidden;letter-spacing:.02em;position:relative}

body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0px,rgba(0,0,0,.25) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.85) 100%);
  box-shadow:inset 0 0 18px #000}

.pixel-font{font-family:'Press Start 2P',monospace}
button,input{font-family:'VT323',ui-monospace,Consolas,monospace;font-size:17px}
button{cursor:pointer}
.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:90px;position:relative;z-index:1;background:#0d0d14;border-left:4px solid #1a1a26;border-right:4px solid #1a1a26}

.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1e1e2e 0%,#0c0c14 100%);border-bottom:4px solid var(--gold);border-top:3px solid var(--neored);padding:10px 16px;box-shadow:0 6px 0 #000,0 10px 20px #000d;display:flex;flex-direction:column;gap:2px}
.neogeo-badge{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;letter-spacing:1px;background:#ff0033;padding:2px 6px;border-radius:2px;font-weight:bold;text-shadow:1px 1px 0 #000}
.neogeo-badge span{color:var(--gold)}
.title{font-family:'Press Start 2P',monospace;font-weight:bold;letter-spacing:.04em;font-size:16px;color:var(--gold);
  text-shadow:3px 3px 0 #880000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;text-transform:uppercase;margin-top:4px}
.subtitle{color:var(--neoblue);font-size:15px;font-family:'VT323',monospace;letter-spacing:.08em;text-transform:uppercase;text-shadow:1px 1px 0 #000}

.content{padding:14px}

.tabs{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#181824 0%,#09090e 100%);border-top:4px solid var(--gold);display:flex;justify-content:center;z-index:10;box-shadow:0 -6px 20px #000e}
.tabs button{max-width:95px;flex:1;background:#10101a;border:0;border-right:2px solid #000;color:var(--muted);padding:12px 2px 14px;font-family:'Press Start 2P',monospace;font-size:6.5px;letter-spacing:0;text-transform:uppercase;transition:all .1s}
.tabs button:hover{background:#1a1a2a;color:#fff}
.tabs button.active{color:var(--gold);background:linear-gradient(180deg,#2a1f0a 0%,#120e05 100%);border-top:3px solid var(--neored);text-shadow:0 0 6px #ffcc00aa}

.card{background:var(--panel);border:3px solid var(--gold);padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 #000,inset 0 0 10px rgba(0,0,0,.8);position:relative;outline:2px solid #000}
.card::before{content:"";position:absolute;top:2px;left:2px;right:2px;height:2px;background:rgba(255,255,255,.15);pointer-events:none}
.card.featured{background:linear-gradient(135deg,#28141a 0%,#12121c 100%);border-color:var(--neored);box-shadow:5px 5px 0 #000,0 0 15px #ff003333}
.hero{background:linear-gradient(135deg,#2a1820 0%,#10101c 60%,#080810 100%);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
h2,h3,h4{margin:0 0 8px;font-family:'Press Start 2P',monospace;font-weight:normal;letter-spacing:0;text-shadow:2px 2px 0 #000}
h2{font-size:13px;color:var(--gold)}h3{font-size:10px;color:var(--neoblue)}h4{font-size:8px;color:var(--neogreen)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.blue{color:var(--neoblue)}
.purple{color:var(--neopurple)}
.good{color:var(--neogreen)}
.bad{color:var(--neored)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stat{background:var(--panel2);padding:10px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000;outline:1px solid #000}
.stat b{display:block;font-size:22px;font-family:'VT323',monospace;color:var(--text);text-shadow:1px 1px 0 #000}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:'Press Start 2P',monospace}

.bar{height:16px;background:#050508;border:2px solid #000;outline:1px solid var(--panel-border2);position:relative;overflow:hidden;background-image:repeating-linear-gradient(90deg,#000 0,#000 4px,#111 4px,#111 6px)}
.fill{height:100%;background:linear-gradient(180deg,#ffe680 0%,#ffcc00 50%,#b38f00 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width 0.2s}
.bar.blue .fill{background:linear-gradient(180deg,#80ebff 0%,#00d9ff 50%,#0088cc 100%)}
.bar.purple .fill{background:linear-gradient(180deg,#f080ff 0%,#d000ff 50%,#8800cc 100%)}
.bar.good .fill{background:linear-gradient(180deg,#80ffaa 0%,#00ff66 50%,#009933 100%)}

button.primary{width:100%;border:3px solid #000;background:linear-gradient(180deg,#ffee66 0%,#ffcc00 50%,#cc9900 100%);color:#000;padding:12px;
  font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:0;text-transform:uppercase;font-weight:bold;
  box-shadow:0 4px 0 #886600,0 6px 0 #000;transition:all .05s;text-shadow:0 1px 0 #ffff99}
button.primary:hover{background:linear-gradient(180deg,#ffff80 0%,#ffd633 50%,#e6ab00 100%)}
button.primary:active{transform:translateY(4px);box-shadow:0 0 0 #000}

button.secondary{border:3px solid #000;background:linear-gradient(180deg,#ff4d4d 0%,#cc0000 100%);color:#fff;padding:8px 10px;
  font-family:'Press Start 2P',monospace;font-size:7.5px;box-shadow:0 3px 0 #660000,0 5px 0 #000;transition:all .05s;text-transform:uppercase;letter-spacing:.03em;text-shadow:1px 1px 0 #000}
button.secondary:hover{background:linear-gradient(180deg,#ff6666 0%,#e60000 100%)}
button.secondary:active{transform:translateY(3px);box-shadow:0 0 0 #000}
button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}

.quest{border:3px solid #3d3d5c;padding:12px;margin:10px 0;background:#10101a;cursor:pointer;transition:all .15s;box-shadow:4px 4px 0 #000;outline:1px solid #000}
.quest:hover{background:#1a1a2b;border-color:var(--gold)}
.quest.boss{border-color:var(--neored);background:linear-gradient(135deg,#33000d 0%,#150006 100%);box-shadow:0 0 15px #ff003344,4px 4px 0 #000}

.tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7px;border:2px solid #536172;padding:4px 6px;color:#c7d0da;margin-right:5px;margin-bottom:5px;text-transform:uppercase;background:#000}
.tag.epic{border-color:var(--neopurple);color:#f0a0ff;background:#2a0038}
.tag.rare{border-color:var(--neoblue);color:#a0f0ff;background:#002b38}
.tag.magic{border-color:var(--neogreen);color:#a0ffa0;background:#003810}
.tag.boss{border-color:var(--neoorange);color:#ffda00;background:#4a1f00}

.log{max-height:220px;overflow-y:auto;font-size:16px;background:#050508;border:3px solid #000;outline:2px solid #2a2a3d;padding:10px;line-height:1.4}
.log div{padding:4px 0;border-bottom:1px solid #1a1a28}
.log div:last-child{border:0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modalbox{width:min(780px,100%);background:#101018;border-top:5px solid var(--gold);border-left:2px solid #222;border-right:2px solid #222;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 -10px 30px #000e,inset 0 1px 0 rgba(255,255,255,.2)}

.item{padding:10px;background:#181824;border:2px solid #3a3a58;margin:8px 0;box-shadow:3px 3px 0 #000}
.item:hover{background:#222234}
.small{font-size:13px}
input{width:100%;background:#08080d;border:3px solid #3a3a58;color:#fff;padding:11px;margin:8px 0;font-size:18px;outline:none}
input:focus{border-color:var(--gold)}

.avatar-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}
.avatar-option{padding:12px;border:3px solid #3a3a58;text-align:center;cursor:pointer;transition:all .15s;background:#0a0a10}
.avatar-option:hover{border-color:var(--neoblue);background:#121220}
.avatar-option.selected{border-color:var(--gold);background:#261d08;box-shadow:0 0 15px #ffcc0055,inset 0 0 10px #ffcc0022}
.avatar-emoji{font-size:40px;margin:6px 0;filter:drop-shadow(3px 3px 0 #000)}

.world-visual{background:linear-gradient(135deg,#20141a 0%,#0a0a12 100%);border:3px solid var(--panel-border2);padding:15px;margin:10px 0;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 15px #000}
.location-badge{display:inline-block;padding:5px 8px;background:rgba(0,217,255,.1);border:2px solid var(--neoblue);color:var(--neoblue);font-size:9px;margin:4px 4px 4px 0;text-transform:uppercase;letter-spacing:.05em;font-family:'Press Start 2P',monospace}

.equipment-grid{display:grid;grid-template-columns:1fr;gap:10px}
.equipment-slot{background:var(--panel2);padding:12px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000;display:flex;justify-content:space-between;align-items:center}
.equipment-slot b{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;font-family:'Press Start 2P',monospace}
.equipment-slot .item-name{color:var(--gold);font-size:17px;font-weight:600}

.damage-number{color:var(--neored);font-weight:bold;text-shadow:2px 2px 0 #000}
.crit-hit{animation:pulse 0.3s;color:var(--neoorange);font-weight:bold;text-shadow:2px 2px 0 #000}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

.danger-stars{color:var(--neoorange);letter-spacing:2px}
.reward-box{background:rgba(255,204,0,.08);border:2px solid var(--gold);padding:12px;margin:10px 0;box-shadow:inset 0 0 10px #000}
.arcade-flicker{animation:flicker 2.4s infinite}
@keyframes flicker{0%,96%,100%{opacity:1}97%{opacity:.6}98%{opacity:1}99%{opacity:.7}}
.insert-coin{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);text-align:center;letter-spacing:.08em;text-shadow:2px 2px 0 #880000}
</style>
</head>

function save(){ localStorage.setItem("rojo_mvs_save", JSON.stringify(S)); }
function load(){
  const x = localStorage.getItem("rojo_mvs_save");

    try {
      S = JSON.parse(x);

}
load();

function addLog(t){ S.log.unshift(t); S.log = S.log.slice(0, 20); }
function xpNeed(){ return 120 + S.level * 60; }

function gainXP(n){
  S.xp += n;
  while(S.xp >= xpNeed()){
    S.xp -= xpNeed();
    S.level++;
    S.stats.str += 2;
    S.stats.dex += 2;
    S.stats.vit += 2;
    S.stats.int += 2;
    addLog(`<span class="good">⭐ LEVEL UP! Reached Level ${S.level}! Attributes increased.</span>`);
  }
}

function rankUp(){
  while(S.rp >= 100){
    S.rp -= 100;
    if(S.rank < RANKS.length - 1){
      S.rank++;
      addLog(`<span class="gold">🏅 Guild Rank Promotion! Promoted to ${RANKS[S.rank]}-Rank!</span>`);
      const rankWorlds = ["safe", "forest", "ruins", "volcanic", "void"];
      if(S.rank < rankWorlds.length && !S.worldUnlocked.includes(rankWorlds[S.rank])){
        S.worldUnlocked.push(rankWorlds[S.rank]);
        addLog(`<span class="blue">🗺️ New Map Unlocked: ${WORLDS[rankWorlds[S.rank]].name}</span>`);
      }
    } else { break; }
  }
}

// ===== EQUIPMENT MANAGEMENT =====
function equipItemFromGear(gearIndex){
  const item = S.gear[gearIndex];
  if(!item) return;

  const slot = item.slot;
  // If slot is occupied, unequip existing item first
  if(S.equipment[slot]){
    unequipSlot(slot, false);
  }

  S.equipment[slot] = item;
  S.gear.splice(gearIndex, 1);
  addLog(`<span class="good">Equipped ${item.name} (${slot.toUpperCase()}).</span>`);
  save();
  render();
}

function unequipSlot(slot, triggerRender = true){
  const item = S.equipment[slot];
  if(!item) return;

  S.gear.push(item);
  S.equipment[slot] = null;
  addLog(`<span class="muted">Unequipped ${item.name}. Returned to Inventory.</span>`);
  save();
  if(triggerRender) render();
}

// ===== STORE & PURCHASING =====
function buyStoreItem(itemKey, isConsumable = false){
  if(isConsumable){
    const item = STORE_CONSUMABLES[itemKey];
    if(!item) return;
    if(S.gold < item.price){
      addLog(`<span class="bad">❌ Not enough Gold! Costs ${item.price}g.</span>`);
      render();
      return;
    }
    S.gold -= item.price;
    S.consumables[item.id] = (S.consumables[item.id] || 0) + 1;
    addLog(`<span class="good">🛒 Purchased ${item.emoji} ${itemKey}. Saved to Inventory.</span>`);
  } else {
    const item = ITEM_DATABASE[itemKey];
    if(!item) return;
    if(S.gold < item.price){
      addLog(`<span class="bad">❌ Not enough Gold! Costs ${item.price}g.</span>`);
      render();
      return;
    }
    S.gold -= item.price;
    S.gear.push({ ...item, name: itemKey });
    addLog(`<span class="good">🛒 Purchased ${itemKey}. Saved to Character Sheet!</span>`);
  }
  save();
  render();
}

// ===== QUEST GENERATION =====
let globalQuests = [];

function generateQuestsForWorld(worldKey){
  const w = WORLDS[worldKey];
  const list = [];
  const count = 3;
  
  for(let i = 0; i < count; i++){
    const isBoss = (i === count - 1);
    const storyTemplate = QUEST_STORIES[Math.floor(Math.random() * QUEST_STORIES.length)];
    const energyCost = 15 + w.danger * 3;

    list.push({
      id: `q-${worldKey}-${i}-${Date.now()}`,
      name: isBoss ? `[BOSS] ${w.name} Siege` : `${storyTemplate.title}`,
      desc: isBoss ? `Defeat the supreme ruler of ${w.name} and its elite guard!` : storyTemplate.desc,
      eventText: storyTemplate.event,
      world: worldKey,
      rank: w.quests[Math.floor(Math.random()*w.quests.length)],
      energyCost: energyCost,
      danger: w.danger + (isBoss ? 2 : 0),
      waves: isBoss ? 3 : 2, // MULTI-WAVE QUEST COMBAT
      reward: (45 + w.danger * 35) * (isBoss ? 2.2 : 1),
      xp: (40 + w.danger * 30) * (isBoss ? 2 : 1),
      boss: isBoss
    });
  }
  return list;
}

function startQuestById(id){
  closeModal();
  const quest = globalQuests.find(q => q.id === id);
  if(!quest) return;

  // STRICT ENERGY REQUIREMENT CHECK
  if(S.energy < quest.energyCost){
    addLog(`<span class="bad">❌ Quest Failed to start: You are out of energy (${S.energy}/${quest.energyCost}). Rest at the Inn!</span>`);
    render();
    return;
  }

  // Deduct Energy
  S.energy -= quest.energyCost;
  save();

  initiateMultiWaveCombat(quest);
}

function initiateMultiWaveCombat(quest){
  const c = CLASSES[S.profession];
  const gBonus = GUILDS[S.guild].bonus;
  
  // Calculate total stats from Stats + Gear + Guild
  const wAtk = S.equipment.weapon ? S.equipment.weapon.atk : 0;
  const aDef = S.equipment.armor ? S.equipment.armor.def : 0;
  const accCrit = S.equipment.accessory ? S.equipment.accessory.crit : 0;
  const accAtk = S.equipment.accessory && S.equipment.accessory.atk ? S.equipment.accessory.atk : 0;

  const maxHp = c.hp + S.level * 12 + (gBonus.maxHp || 0) + S.stats.vit * 3;
  const totalAtk = c.atk + S.level * 2.5 + wAtk + accAtk + (gBonus.atk || 0) + S.stats.str * 0.8;
  const totalDef = c.def + S.level * 1.5 + aDef + (gBonus.def || 0);
  const totalCrit = c.crit + accCrit + (gBonus.crit || 0) + S.stats.dex * 0.3;

  combatState = {
    active: true,
    quest: quest,
    currentWave: 1,
    totalWaves: quest.waves,
    tempAtkBuff: 0,
    player: {
      hp: maxHp,
      maxHp: maxHp,
      atk: totalAtk,
      def: totalDef,
      crit: totalCrit,
      mag: c.mag + S.level * 2 + (gBonus.mag || 0)
    },
    enemy: {},
    log: []
  };

  combatState.log.push(`<b>📖 ${quest.name}</b>`);
  combatState.log.push(`<span class="muted">${quest.eventText}</span>`);
  
  spawnWaveEnemy();
  renderCombatUI();
}

function spawnWaveEnemy(){
  const q = combatState.quest;
  const isFinalBoss = (combatState.currentWave === combatState.totalWaves && q.boss);
  
  let baseEnemy;
  if(isFinalBoss){
    baseEnemy = BOSSES[q.world] || BOSSES.safe;
  } else {
    const pool = BESTIARY[q.world] || BESTIARY.safe;
    baseEnemy = pool[Math.floor(Math.random() * pool.length)];
  }

  // REBALANCED ENEMY STATS (HARDER COMBAT)
  const waveMultiplier = 1 + (combatState.currentWave - 1) * 0.3;
  combatState.enemy = {
    name: baseEnemy.name,
    emoji: baseEnemy.emoji,
    maxHp: Math.round(baseEnemy.hp * waveMultiplier),
    hp: Math.round(baseEnemy.hp * waveMultiplier),
    atk: Math.round(baseEnemy.atk * waveMultiplier),
    def: Math.round(baseEnemy.def * waveMultiplier)
  };

  combatState.log.push(`<span class="bad">⚠️ WAVE ${combatState.currentWave}/${combatState.totalWaves}: ${combatState.enemy.emoji} ${combatState.enemy.name} steps forward!</span>`);
}

function useCombatConsumable(itemKey){
  const p = combatState.player;
  if(itemKey === 'pot_hp' || itemKey === 'pot_ghp'){
    const count = S.consumables[itemKey] || 0;
    if(count <= 0) return;
    const item = Object.values(STORE_CONSUMABLES).find(x => x.id === itemKey);
    S.consumables[itemKey]--;
    const healVal = item.value;
    p.hp = Math.min(p.maxHp, p.hp + healVal);
    combatState.log.push(`<span class="good">🧪 Used ${itemKey}! Restored ${healVal} HP. (${Math.round(p.hp)}/${p.maxHp} HP)</span>`);
  } else if(itemKey === 'pot_buff'){
    const count = S.consumables['pot_buff'] || 0;
    if(count <= 0) return;
    S.consumables['pot_buff']--;
    combatState.tempAtkBuff += 10;
    combatState.log.push(`<span class="gold">🔥 Used War Tonic! Attack increased by +10 for this battle!</span>`);
  }
  save();
  renderCombatUI();
}

function execCombatTurn(action){
  const p = combatState.player;
  const e = combatState.enemy;
  const effectiveAtk = p.atk + combatState.tempAtkBuff;

  let playerDamage = 0;
  let guardActive = false;

  if(action === 'attack'){
    const isCrit = Math.random() * 100 < p.crit;
    const baseDmg = Math.max(4, effectiveAtk - e.def * 0.4);
    playerDamage = Math.round(isCrit ? baseDmg * 1.6 : baseDmg);
    e.hp -= playerDamage;
    combatState.log.push(isCrit 
      ? `<span class="crit-hit">💥 CRITICAL STRIKE!</span> Dealt <span class="damage-number">${playerDamage}</span> damage!`
      : `You strike the enemy for <span class="damage-number">${playerDamage}</span> damage.`);
  } else if(action === 'skill'){
    playerDamage = Math.round(Math.max(8, effectiveAtk * 1.35 - e.def * 0.25));
    e.hp -= playerDamage;
    combatState.log.push(`✨ You channel class technique! Dealt <span class="damage-number">${playerDamage}</span> damage!`);
  } else if(action === 'guard'){
    guardActive = true;
    combatState.log.push(`🛡️ You take up a defensive guard position! (50% damage reduction)`);
  } else if(action === 'flee'){
    addLog(`Fled from the quest. Stamina energy spent was lost.`);
    closeModal();
    render();
    return;
  }

  // Check if current wave enemy defeated
  if(e.hp <= 0){
    combatState.log.push(`<span class="good">🎯 Defeated ${e.name}!</span>`);
    if(combatState.currentWave < combatState.totalWaves){
      combatState.currentWave++;
      spawnWaveEnemy();
      renderCombatUI();
      return;
    } else {
      // Victory in all waves
      finishQuestVictory();
      return;
    }
  }

  // Enemy counter-attack (BALANCED - HARDER COMBAT)
  let enemyDamage = Math.max(3, e.atk - p.def * 0.5);
  if(guardActive) enemyDamage = Math.round(enemyDamage * 0.5);

  p.hp -= enemyDamage;
  combatState.log.push(`<span class="bad">💥 ${e.name} attacks back! Took <span class="damage-number">${Math.round(enemyDamage)}</span> damage!</span>`);

  if(p.hp <= 0){
    finishQuestDefeat();
    return;
  }

  renderCombatUI();
}

function finishQuestVictory(){
  const q = combatState.quest;
  S.gold += Math.round(q.reward);
  gainXP(q.xp);
  S.rp += q.boss ? 30 : 15;
  S.wins++;
  rankUp();

  // Chance for high tier gear drop
  if(Math.random() < 0.6){
    const poolKeys = Object.keys(ITEM_DATABASE);
    const dropKey = poolKeys[Math.floor(Math.random()*poolKeys.length)];
    const dropItem = ITEM_DATABASE[dropKey];
    S.gear.push({ ...dropItem, name: dropKey });
    addLog(`<span class="purple">🎁 VICTORY DROP: Found ${dropKey}! Added to Inventory.</span>`);
  }

  addLog(`<span class="good">🏆 QUEST CLEARED: ${q.name}! Won ${Math.round(q.reward)}g & ${Math.round(q.xp)} XP!</span>`);
  
  // Remove quest from global board
  globalQuests = globalQuests.filter(x => x.id !== q.id);
  save();

  modal(`
    <h2>🏆 QUEST VICTORY!</h2>
    <p>You have successfully survived all <b>${q.waves} enemy waves</b> and fulfilled the guild contract!</p>
    <div class="reward-box">
      <div>Gold Earned: <b class="gold">+${Math.round(q.reward)}g</b></div>
      <div>XP Gained: <b class="blue">+${Math.round(q.xp)} XP</b></div>
    </div>
    <button class="primary" onclick="closeModal();render()">Return to Guild Board</button>
  `);
}

function finishQuestDefeat(){
  S.losses++;
  addLog(`<span class="bad">☠️ DEFEATED on Quest: ${combatState.quest.name}. Rest & gear up before trying again.</span>`);
  save();

  modal(`
    <h2 class="bad">💀 QUEST FAILED</h2>
    <p>Your party was overwhelmed by the enemy waves. Strengthen your equipment at the shop or rest at the inn.</p>
    <button class="primary" onclick="closeModal();render()">Return to Base</button>
  `);
}

    <div class="card">
      <button class="secondary" onclick="globalQuests=[];render()" style="width:100%">🔄 REFRESH QUEST CONTRACTS</button>
    </div>

    ${globalQuests.map(q => `
      <div class="quest ${q.boss ? 'boss':''}">
        <div class="row between">
          <div>
            <span class="tag">${q.rank}-RANK</span>
            <span class="tag purple">${q.waves} WAVES</span>
            ${q.boss ? '<span class="tag boss">⭐ BOSS</span>':''}
            <h3>${q.name}</h3>
          </div>
          <div style="text-align:right">
            <div class="gold" style="font-size:16px">${Math.round(q.reward)}g</div>
            <div class="blue small">+${Math.round(q.xp)} XP</div>
          </div>
        </div>
        <p class="muted small" style="margin:6px 0">${q.desc}</p>
        <div class="row between" style="margin-top:10px">
          <div class="small ${S.energy >= q.energyCost ? 'good':'bad'}">⚡ Required Energy: ${q.energyCost}</div>
          <button class="primary" onclick="selectQuestFromBoard('${q.id}')" style="width:auto;padding:8px 14px">View Quest</button>
        </div>
      </div>
    `).join("")}
  `;
}

function viewShop(){
  return `
    <div class="card featured">
      <h2>🏪 GUILD MARKETPLACE</h2>
      <p class="muted small">Purchase impactful potions & high-tier weapons. Purchased gear goes directly to your inventory!</p>
    </div>

    <div class="card">
      <h3>🧪 POTIONS & CONSUMABLES (USABLE IN QUESTS)</h3>
      ${Object.entries(STORE_CONSUMABLES).map(([name, item]) => `
        <div class="item row between">
          <div>
            <b>${item.emoji} ${name}</b>
            <div class="muted small">${item.desc}</div>
            <div class="gold small">Price: ${item.price}g | Owned: ${S.consumables[item.id] || 0}</div>
          </div>
          <button class="secondary" onclick="buyStoreItem('${name}', true)">Buy</button>
        </div>
      `).join("")}
    </div>

    <div class="card">
      <h3>⚔️ WEAPONS & ARMOR SHOP</h3>
      ${Object.entries(ITEM_DATABASE).map(([name, item]) => `
        <div class="item row between">
          <div>
            <b class="${item.rarity.toLowerCase()}">${name}</b> (${item.rarity} ${item.slot.toUpperCase()})
            <div class="muted small">${item.desc}</div>
            <div class="gold small">Price: ${item.price}g | ${item.atk ? '+'+item.atk+' ATK ' : ''}${item.def ? '+'+item.def+' DEF ' : ''}${item.crit ? '+'+item.crit+'% Crit' : ''}</div>
          </div>
          <button class="secondary" onclick="buyStoreItem('${name}', false)">Buy</button>
        </div>
      `).join("")}
    </div>
  `;
}

function viewGuilds(){
  return `
    <div class="card featured">
      <h2>🎖️ FACTION GUILDS</h2>
      <p class="muted small">Join any guild once you meet the required Level and Rank Points! (Class restrictions removed)</p>
    </div>

    <div class="card">
      ${Object.entries(GUILDS).map(([gName, gData]) => {
        const canJoin = S.level >= gData.req.level && S.rp >= gData.req.rp;
        const isCurrent = S.guild === gName;

        return `
          <div class="item" style="border-left:4px solid ${isCurrent ? 'var(--gold)':'#3a3a58'}">
            <div class="row between">
              <div>
                <b>${gData.icon} ${gName} Guild</b>
                <div class="muted small">${gData.desc}</div>
                <div class="small muted" style="margin-top:4px">Requirements: Level ${gData.req.level}, ${gData.req.rp} Rank Points</div>
              </div>
              ${isCurrent 
                ? `<span class="tag gold">CURRENT</span>`
                : `<button class="secondary" onclick="joinFactionGuild('${gName}')" ${canJoin?'':'disabled'}>Join</button>`
              }
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function joinFactionGuild(gName){
  S.guild = gName;
  addLog(`<span class="purple">🎖️ Joined the ${gName} Guild!</span>`);
  save();
  render();
}

function viewInventory(){
  const potHp = S.consumables['pot_hp'] || 0;
  const potGhp = S.consumables['pot_ghp'] || 0;
  const potEng = S.consumables['pot_eng'] || 0;
  const potBuff = S.consumables['pot_buff'] || 0;

  return `
    <div class="card featured">
      <h2>🎒 CHARACTER INVENTORY</h2>
      <p class="muted small">All stored equipment and consumables bought from the marketplace or won from quests.</p>
    </div>

    <!-- CONSUMABLES IN INVENTORY -->
    <div class="card">
      <h3>🧪 CONSUMABLES & POTIONS</h3>
      <div class="grid">
        <div class="item">
          <b>🧪 Health Potions</b>: ${potHp}
          <div class="muted small">Restores 60 HP in battle</div>
        </div>
        <div class="item">
          <b>🍷 Greater Potions</b>: ${potGhp}
          <div class="muted small">Restores 140 HP in battle</div>
        </div>
        <div class="item">
          <b>⚡ Energy Elixirs</b>: ${potEng}
          <div class="muted small">Restores +50 Stamina</div>
          ${potEng > 0 ? `<button class="secondary" onclick="useEnergyElixir()" style="margin-top:4px">Use Now</button>`:''}
        </div>
        <div class="item">
          <b>🔥 War Tonics</b>: ${potBuff}
          <div class="muted small">+10 ATK in next battle</div>
        </div>
      </div>
    </div>

    <!-- EQUIPMENT STORAGE -->
    <div class="card">
      <h3>⚔️ EQUIPMENT STORAGE (${S.gear.length} ITEMS)</h3>
      ${S.gear.length === 0 
        ? `<p class="muted">No unequipped items in storage. Buy items at the Shop or earn them in Quests!</p>`
        : S.gear.map((item, index) => `
            <div class="item row between">
              <div>
                <b>${item.name}</b> (${item.slot.toUpperCase()})
                <div class="muted small">${item.desc}</div>
                <div class="gold small">${item.atk ? '+'+item.atk+' ATK ' : ''}${item.def ? '+'+item.def+' DEF ' : ''}${item.crit ? '+'+item.crit+'% Crit' : ''}</div>
              </div>
              <button class="primary" onclick="equipItemFromGear(${index})" style="width:auto;padding:6px 12px">Equip</button>
            </div>
          `).join("")
      }
    </div>
  `;
}

function useEnergyElixir(){
  if((S.consumables['pot_eng']||0) > 0){
    S.consumables['pot_eng']--;
    S.energy = Math.min(100, S.energy + 50);
    addLog(`<span class="good">⚡ Consumed Energy Elixir! Restored +50 Stamina Energy.</span>`);
    save();
    render();
  }
}

function viewSettings(){
  return `
    <div class="card featured">
      <h2>⚙️ SYSTEM OPTIONS</h2>
    </div>
    <div class="card">
      <button class="secondary" onclick="resetGame()" style="width:100%;color:var(--neored)">🔄 RESET MEMORY CARD SAVE DATA</button>
    </div>
  `;
}

function resetGame(){
  if(confirm("Reset save data permanently?")){
    S = freshState();
    save();
    render();
  }
}

function modal(content){
  document.getElementById("modal").innerHTML = `<div class="modal"><div class="modalbox">${content}</div></div>`;
}

function closeModal(){
  document.getElementById("modal").innerHTML = "";
}

function createCharacterModal(){
  modal(`
    <p class="insert-coin arcade-flicker">🔴 NEO-GEO MVS SYSTEM 🔴</p>
    <h2 style="text-align:center;margin-top:10px">SELECT YOUR HERO</h2>
    
    <div class="avatar-selector">
      ${AVATARS.map((a, i) => `
        <div class="avatar-option ${i===0?'selected':''}" onclick="selectAvatar(${i})">
          <div class="avatar-emoji">${a.emoji}</div>
          <b>${a.name}</b>
          <div class="muted small">${a.class}</div>
        </div>
      `).join("")}
    </div>
    
    <label>Hero Name:</label>
    <input type="text" id="nameInput" value="Rojo">
    
    <button class="primary" onclick="finishCharacterCreation()">▶ START ADVENTURE</button>
  `);
}

function selectAvatar(i){
  S.avatar = AVATARS[i];
  S.profession = AVATARS[i].class;
  document.querySelectorAll(".avatar-option").forEach((el, idx) => {
    if(i === idx) el.classList.add("selected");
    else el.classList.remove("selected");
  });
}

function finishCharacterCreation(){
  S.name = document.getElementById("nameInput").value || "Rojo";
  closeModal();
  save();
  render();
}

// NAVIGATION TAB CONTROLLER
let tab = "guild";

function render(){
  document.getElementById("topSub").textContent = `RANK: ${RANKS[S.rank]} • ${S.gold} GOLD • STAMINA: ${S.energy}/100`;

  const views = {
    guild: viewGuild,
    quests: viewQuests,
    shop: viewShop,
    guilds: viewGuilds,
    inventory: viewInventory,
    settings: viewSettings
  };

  const navNames = {
    guild: "🏛️ GUILD",
    quests: "⚔️ QUESTS",
    shop: "🏪 SHOP",
    guilds: "🎖️ FACTIONS",
    inventory: "🎒 ITEMS",
    settings: "⚙️ SYSTEM"
  };

  document.getElementById("view").innerHTML = views[tab]();

  document.getElementById("tabs").innerHTML = Object.keys(navNames).map(k => `
    <button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${navNames[k]}</button>
  `).join("");
}

// STARTUP
if(!localStorage.getItem("rojo_mvs_save")){
  createCharacterModal();
} else {
  render();
}
</script>
</body>
</html>
