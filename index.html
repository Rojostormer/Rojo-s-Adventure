<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Adventurers Guild — Reimagined Prototype</title>
<style>
:root{--bg:#0d1117;--panel:#151c26;--panel2:#1c2633;--gold:#d8ad55;--text:#edf1f5;--muted:#9ca8b5;--good:#68c78a;--bad:#e26b6b;--blue:#67a7e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b1016,#111a24);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:5;background:#0d131bfa;border-bottom:1px solid #2b3744;padding:14px 16px;backdrop-filter:blur(10px)}
.title{font-weight:800;letter-spacing:.04em}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}
.content{padding:14px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101720f5;border-top:1px solid #2b3744;display:flex;justify-content:center;z-index:10;backdrop-filter:blur(12px)}
.tabs button{max-width:150px;flex:1;background:none;border:0;color:var(--muted);padding:10px 5px 12px;font-size:11px}.tabs button.active{color:var(--gold)}
.card{background:var(--panel);border:1px solid #2a3542;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0003}
.hero{background:radial-gradient(circle at 80% 10%,#30435b,#17202b 50%,#121923);border-color:#3d4b5b}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
h2,h3{margin:0 0 8px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);padding:10px;border-radius:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.bar{height:8px;background:#0a0e13;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--gold);border-radius:99px}
button.primary{width:100%;border:1px solid #8b6d32;background:#8a692c;color:#fff;padding:12px;border-radius:10px;font-weight:800}
button.secondary{border:1px solid #394958;background:#202c39;color:#fff;padding:9px 11px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed}.quest{border:1px solid #2c3947;border-radius:12px;padding:12px;margin:8px 0;background:#17202a}
.tag{display:inline-block;font-size:10px;border:1px solid #536172;border-radius:99px;padding:3px 7px;color:#c7d0da;margin-right:5px}
.log{max-height:310px;overflow:auto;font-size:12px;background:#0b1016;border-radius:10px;padding:9px}.log div{padding:5px 0;border-bottom:1px solid #202a34}.good{color:var(--good)}.bad{color:var(--bad)}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(760px,100%);background:#131b24;border:1px solid #354252;border-radius:18px 18px 0 0;padding:18px;max-height:88vh;overflow:auto}
.item{padding:10px;background:#18232e;border-radius:10px;border:1px solid #2d3b49;margin:7px 0}.small{font-size:12px}.right{text-align:right}
input{width:100%;background:#0e151d;border:1px solid #344352;color:#fff;padding:11px;border-radius:9px;margin:8px 0}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="title">THE ADVENTURERS GUILD</div><div class="subtitle" id="topSub"></div></div>
<div class="content" id="view"></div>
<div class="tabs" id="tabs"></div>
</div>
<div id="modal"></div>
<script>
const RANKS=["F","E","D","C","B","A","S"];
const CLASSES={
Adventurer:{desc:"Balanced beginner profession.",hp:105,atk:12,def:8,spd:10,mag:5,crit:5},
Caster:{desc:"Magic-focused; strong damage and utility.",hp:80,atk:6,def:5,spd:9,mag:16,crit:8},
Defender:{desc:"Heavy armor and high damage resistance.",hp:145,atk:10,def:16,spd:6,mag:3,crit:3},
Fighter:{desc:"High physical damage.",hp:110,atk:17,def:8,spd:9,mag:3,crit:7},
Rogue:{desc:"Fast, evasive and critical-hit focused.",hp:85,atk:14,def:6,spd:15,mag:4,crit:15}
};
const ENEMIES=[
{name:"Giant Rat",hp:38,atk:7,def:2,spd:8,xp:18,gold:10},
{name:"Goblin Scout",hp:48,atk:9,def:3,spd:9,xp:24,gold:15},
{name:"Forest Wolf",hp:62,atk:11,def:4,spd:12,xp:31,gold:22},
{name:"Bandit",hp:72,atk:13,def:6,spd:10,xp:42,gold:32},
{name:"Cave Troll",hp:145,atk:19,def:10,spd:6,xp:95,gold:85,boss:true}
];
const QUESTS=[
{name:"Patrol: Guildtown Road",rank:"F",danger:1,desc:"A routine patrol outside town.",reward:35,xp:35,turns:7},
{name:"Gather Mooncap",rank:"F",danger:1,desc:"Collect rare herbs from the northern trail.",reward:48,xp:45,turns:8},
{name:"Goblin Trouble",rank:"F",danger:2,desc:"Clear a goblin camp threatening travellers.",reward:72,xp:65,turns:9},
{name:"Escort the Merchant",rank:"E",danger:2,desc:"Protect a merchant caravan through wolf country.",reward:105,xp:90,turns:10},
{name:"Bandit Hideout",rank:"E",danger:3,desc:"Investigate reports of bandits near the old mine.",reward:145,xp:125,turns:11},
{name:"The Cave Troll",rank:"D",danger:5,desc:"A dangerous named threat. Boss rewards are better.",reward:260,xp:240,turns:14,boss:true}
];
let S=JSON.parse(localStorage.getItem("tag_reimagined"))||null;
function fresh(){return {name:"Rook",level:1,xp:0,gold:100,rank:0,rp:0,profession:"Adventurer",profLevel:1,profXp:0,energy:100,craft:0,mastery:0,equipment:{weapon:0,armor:0,accessory:0},gear:[{name:"Training Sword",slot:"weapon",atk:4,rarity:"Common"},{name:"Travel Clothes",slot:"armor",def:2,rarity:"Common"}],stats:{str:5,dex:5,vit:5,int:5,luck:5},quests:0, wins:0, losses:0, log:["You arrive in Guildtown with 100 gold and a battered training sword."],started:Date.now()}}
if(!S)S=fresh();
function save(){localStorage.setItem("tag_reimagined",JSON.stringify(S))}
function xpNeed(){return 50+S.level*35}
function power(){let c=CLASSES[S.profession],e=S.equipment;return Math.round((c.hp+S.level*8+(e.armor||0)*8+(e.weapon||0)*4)*.15+(c.atk+S.level*1.7+(e.weapon||0)*2)*2+(c.def+(e.armor||0)*2)*2+c.spd)}
function addLog(x){S.log.unshift(x);S.log=S.log.slice(0,80);save()}
function gainXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;S.stats.str++;S.stats.dex++;S.stats.vit++;S.stats.int++;S.stats.luck++;addLog(`<span class="good">Level up! You reached level ${S.level}.</span>`);if(S.level===3)addLog("Your first Profession slot is unlocked.");}}
function rankUp(){while(S.rp>=100){S.rp-=100;if(S.rank<RANKS.length-1){S.rank++;addLog(`<span class="gold">Guild promotion! You are now ${RANKS[S.rank]}-Rank.</span>`)}else{addLog(`<span class="gold">Your guild standing is legendary.</span>`);break}}}
function gearFor(rarity){let mult={Common:1,Magic:1.5,Rare:2.2,Epic:3.3}[rarity]||1;let slot=["weapon","armor","accessory"][Math.floor(Math.random()*3)];let n=slot==="weapon"?"Forged Blade":slot==="armor"?"Reinforced Mail":"Lucky Charm";let g={name:n,slot,atk:slot==="weapon"?Math.round(5*mult):0,def:slot==="armor"?Math.round(4*mult):0,crit:slot==="accessory"?Math.round(3*mult):0,rarity};return g}
function buyGear(){let price=70+S.rank*90;if(S.gold<price)return addLog("Not enough gold.");let rarity=S.rank>=3?"Rare":S.rank>=1?"Magic":"Common";S.gold-=price;S.gear.push(gearFor(rarity));addLog(`Purchased ${rarity} equipment for ${price} gold.`);save();render()}
function equip(i){let g=S.gear[i];S.equipment[g.slot]=g.slot==="weapon"?g.atk:g.slot==="armor"?g.def:g.crit;S.gear.splice(i,1);addLog(`Equipped ${g.name}.`);save();render()}
function chooseQuest(q){if(RANKS.indexOf(q.rank)>S.rank+1)return addLog("Your guild rank is too low for this contract.");if(S.energy<20)return addLog("You are exhausted. Recover energy first.");S.energy-=20;modal(`<h2>${q.name}</h2><p class="muted">${q.desc}</p><div class="grid"><div class="stat"><span>Danger</span><b>${"★".repeat(q.danger)}</b></div><div class="stat"><span>Reward</span><b>${q.reward}g</b></div></div><button class="primary" onclick="startQuest(${QUESTS.indexOf(q)})">Accept Contract</button><br><br><button class="secondary" onclick="closeModal()">Cancel</button>`)}
function startQuest(idx){closeModal();let q=QUESTS[idx], c=CLASSES[S.profession], p={hp:c.hp+S.level*8+(S.equipment.armor||0)*8,atk:c.atk+S.level*1.7+(S.equipment.weapon||0)*2,def:c.def+(S.equipment.armor||0)*2,spd:c.spd,mag:c.mag+S.level,crit:c.crit+(S.equipment.accessory||0)};let e=ENEMIES[Math.min(ENEMIES.length-1,Math.max(0,q.danger-1))];let enemy={...e,hp:e.hp+S.rank*12+(q.boss?20:0),atk:e.atk+S.rank*2};let log=[];let turn=0;while(p.hp>0&&enemy.hp>0&&turn<q.turns*2){turn++;let playerFirst=p.spd>=enemy.spd;if((turn%2===1&&playerFirst)||(turn%2===0&&!playerFirst)){let crit=Math.random()*100<p.crit;let dmg=Math.max(1,Math.round(p.atk-enemy.def*.55)*(crit?1.5:1));enemy.hp-=dmg;log.push(`You ${crit?"critically ":""}hit ${enemy.name} for ${dmg}.`)}else{let dodge=Math.random()*100<(S.profession==="Rogue"?12:4);if(dodge)log.push(`You dodge ${enemy.name}'s attack.`);else{let dmg=Math.max(1,Math.round(enemy.atk-p.def*.45));p.hp-=dmg;log.push(`${enemy.name} hits you for ${dmg}.`)}}}
let win=p.hp>0&&enemy.hp<=0;if(win){let bonus=q.boss?Math.round(q.reward*1.8):q.reward;S.gold+=bonus;gainXP(q.xp);S.rp+=q.boss?28:12;S.quests++;S.wins++;S.profXp+=Math.round(q.xp*.7);if(S.profXp>=S.profLevel*100&&S.profLevel<10){S.profXp=0;S.profLevel++;if(S.profLevel===10){S.mastery++;addLog(`<span class="gold">${S.profession} mastery achieved.</span>`)}else addLog(`${S.profession} advanced to profession level ${S.profLevel}.`)}rankUp();let g=gearFor(q.boss?"Epic":S.rank>=3?"Rare":S.rank>=1?"Magic":"Common");if(Math.random()<(q.boss?.75:.38)){S.gear.push(g);log.push(`Loot found: ${g.rarity} ${g.name}.`)}addLog(`<span class="good">${q.name} completed. +${bonus}g, +${q.xp} XP, +${q.boss?28:12} rank points.</span>`)}else{S.losses++;addLog(`<span class="bad">${q.name} failed. The contract pays nothing.</span>`)}save();combatModal(q,log,win)}
function combatModal(q,logs,win){modal(`<h2>${win?"Contract Complete":"Defeat"}</h2><p>${win?"The guild records your success.":"You barely escape with your life."}</p><div class="log">${logs.map(x=>`<div>${x}</div>`).join("")}</div><br><button class="primary" onclick="closeModal();render()">Return to Guild</button>`)}
function modal(x){document.getElementById("modal").innerHTML=`<div class="modal"><div class="modalbox">${x}</div></div>`}
function closeModal(){document.getElementById("modal").innerHTML=""}
function rest(){S.energy=Math.min(100,S.energy+45);S.gold=Math.max(0,S.gold-10);addLog("You rest at the guild inn. Energy restored.");render()}
function setProf(p){if(S.level<3)return addLog("Professions unlock at level 3.");S.profession=p;S.profLevel=1;S.profXp=0;addLog(`Profession changed to ${p}. (24-hour cooldown in the original design.)`);render()}
function reset(){if(confirm("Reset this prototype save?")){S=fresh();save();render()}}
function profile(){return `<div class="card hero"><div class="row between"><div><h2>${S.name}</h2><div class="muted">${RANKS[S.rank]}-Rank • Level ${S.level} • ${S.profession}</div></div><div class="gold" style="font-size:24px">✦</div></div><br><div class="bar"><div class="fill" style="width:${S.xp/xpNeed()*100}%"></div></div><div class="small muted">${S.xp}/${xpNeed()} XP</div></div>
<div class="grid3"><div class="stat"><span>Gold</span><b>${S.gold}</b></div><div class="stat"><span>Rank Points</span><b>${S.rp}/100</b></div><div class="stat"><span>Energy</span><b>${S.energy}/100</b></div></div>
<div class="card"><h3>Character</h3><div class="grid">${Object.entries(S.stats).map(([k,v])=>`<div class="stat"><span>${k.toUpperCase()}</span><b>${v}</b></div>`).join("")}</div></div>`}
function guild(){return profile()+`<div class="card"><div class="row between"><h3>Guild Standing</h3><span class="tag">${RANKS[S.rank]}-RANK</span></div><p class="muted small">Complete contracts to earn Rank Points. Higher standing opens more dangerous work and better equipment.</p><button class="secondary" onclick="rest()">Rest & recover (10g)</button></div><div class="card"><h3>Recent Activity</h3><div class="log">${S.log.map(x=>`<div>${x}</div>`).join("")}</div></div>`}
function quests(){let max=S.rank+1;return `<div class="card"><h2>Quest Board</h2><p class="muted small">Available contracts up to one rank above your current guild standing.</p></div>`+QUESTS.filter(q=>RANKS.indexOf(q.rank)<=max).map((q,i)=>`<div class="quest"><div class="row between"><div><span class="tag">${q.rank}-Rank</span>${q.boss?'<span class="tag">BOSS</span>':''}<h3>${q.name}</h3></div><b class="gold">${q.reward}g</b></div><div class="muted small">${q.desc}</div><br><button class="primary" onclick="chooseQuest(QUESTS[${i}])">View Contract</button></div>`).join("")}
function party(){return `<div class="card"><h2>Profession</h2><p class="muted small">Professions unlock at Level 3 and have their own progression. Changing profession is limited by a 24-hour cooldown in the original game design.</p>${Object.entries(CLASSES).map(([n,c])=>`<div class="item"><div class="row between"><div><b>${n}</b><div class="muted small">${c.desc}</div></div><button class="secondary" onclick="setProf('${n}')">${S.profession===n?"Active":"Choose"}</button></div></div>`).join("")}</div>
<div class="card"><h3>${S.profession} Progress</h3><div class="bar"><div class="fill" style="width:${S.profXp/(S.profLevel*100)*100}%"></div></div><div class="small muted">Profession Lv ${S.profLevel}/10 • ${S.profXp}/${S.profLevel*100} XP • Mastery ${S.mastery}</div></div>`}
function shop(){return `<div class="card"><h2>Guild Quartermaster</h2><p class="muted small">Equipment is the main early-game power curve. The original game also tied equipment and crafting into its WAX/NFT economy; this recreation uses a local, non-blockchain economy.</p><button class="primary" onclick="buyGear()">Buy random gear — ${70+S.rank*90}g</button></div><div class="card"><h3>Inventory</h3>${S.gear.length?S.gear.map((g,i)=>`<div class="item"><div class="row between"><div><b>${g.name}</b><div class="muted small">${g.rarity} • ${g.slot} • ATK +${g.atk||0} DEF +${g.def||0} CRIT +${g.crit||0}</div></div><button class="secondary" onclick="equip(${i})">Equip</button></div></div>`).join(""):"<div class='muted'>No spare equipment.</div>"}</div>`}
function settings(){return `<div class="card"><h2>Prototype</h2><p class="muted small">This is a fan-made, offline browser recreation inspired by surviving TAG documentation. It does not use the original servers, blockchain, NFTs, artwork, or proprietary backend.</p><button class="secondary" onclick="exportSave()">Export Save</button> <button class="secondary" onclick="reset()">Reset Save</button></div><div class="card"><h3>Research notes</h3><div class="small muted">Recovered mechanics currently represented: Discord/text RPG structure, Guildtown, profile/inventory/pets/adventures, Patrols, Random Quest and Quest Journal, five professions (Adventurer/Caster/Defender/Fighter/Rogue), profession XP and level 1–10 mastery, level-based stats, equipment, crafting materials, GUILD rewards, Mystery Chests and anti-bot checks. Blockchain/NFT elements are intentionally replaced with offline systems.</div></div>`}
function exportSave(){let a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="tag-reimagined-save.json";a.click()}
let tab="guild";function render(){let names={guild:"Guild",quests:"Quests",party:"Character",shop:"Shop",settings:"More"};document.getElementById("topSub").textContent=`${RANKS[S.rank]}-Rank • ${S.gold}g • ${S.energy} Energy`;let views={guild:guild,quests:quests,party:party,shop:shop,settings:settings};document.getElementById("view").innerHTML=views[tab]();document.getElementById("tabs").innerHTML=Object.keys(names).map(k=>`<button class="${tab===k?"active":""}" onclick="tab='${k}';render()">${names[k]}</button>`).join("")}
render();
</script>
</body></html>
