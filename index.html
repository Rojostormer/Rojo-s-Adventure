function save(){localStorage.setItem("tag-save",JSON.stringify(S))}
function load(){const x=localStorage.getItem("tag-save");if(x)S=JSON.parse(x)}

function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,20)}
function xpNeed(){return 100+S.level*50}

function gainXP(n){
  S.xp += n;
  while(S.xp >= xpNeed()){
    S.xp -= xpNeed();
    S.level++;
    S.stats.str += 1;
    S.stats.dex += 1;
    S.stats.vit += 1;
    S.stats.int += 1;
    S.stats.luck += 1;
    S.skillPoints += 1;
    addLog(`<span class="good">⭐ LEVEL UP! You are now Level ${S.level}!</span>`);
    checkAbilityUnlocks();
  }
}

function checkAbilityUnlocks(){
  const prof = S.profession;
  if(ABILITIES[prof]){
    ABILITIES[prof].forEach(a => {
      if(S.level >= a.level && !S.unlockedAbilities[a.name]){
        S.unlockedAbilities[a.name] = true;
        addLog(`<span class="purple">✨ New Ability Unlocked: ${a.name}</span>`);
      }
    });
  }
}

function rankUp(){
  while(S.rp >= 100){
    S.rp -= 100;
    if(S.rank < RANKS.length-1){
      S.rank++;
      addLog(`<span class="gold">🏅 Guild Promotion! You are now ${RANKS[S.rank]}-Rank.</span>`);
      if(S.rank >= 2 && !S.worldUnlocked.includes("forest")){
        S.worldUnlocked.push("forest");
        addLog(`<span class="blue">🗺️ New World Unlocked: Whisperwood Forest</span>`);
      }
      if(S.rank >= 4 && !S.worldUnlocked.includes("ruins")){
        S.worldUnlocked.push("ruins");
        addLog(`<span class="blue">🗺️ New World Unlocked: Forgotten Catacombs</span>`);
      }
      if(S.rank >= 5 && !S.worldUnlocked.includes("volcanic")){
        S.worldUnlocked.push("volcanic");
        addLog(`<span class="blue">🗺️ New World Unlocked: Scorched Crater</span>`);
      }
      if(S.rank >= 6 && !S.worldUnlocked.includes("void")){
        S.worldUnlocked.push("void");
        addLog(`<span class="blue">🗺️ The Void's Edge has opened...</span>`);
      }
    } else {
      addLog(`<span class="gold">👑 You have reached legendary status!</span>`);
      break;
    }
  }
}

function generateQuestsForWorld(world){
  const w = WORLDS[world];
  const questTypes = ["Patrol", "Beast Hunt", "Salvage", "Purge", "Expedition"];
  const questCount = Math.floor(Math.random()*2) + 3;
  const quests = [];
  
  for(let i = 0; i < questCount; i++){
    const type = questTypes[Math.floor(Math.random()*questTypes.length)];
    const rankIdx = w.quests[Math.floor(Math.random()*w.quests.length)];
    const isBoss = Math.random() < 0.2;
    const danger = RANKS.indexOf(rankIdx) + 1;
    
    quests.push({
      id: `${world}-${i}`,
      name: `[${rankIdx}] ${type}: ${w.name}`,
      desc: `Venture into ${w.name}. ${isBoss?"Battle a legendary foe!":"Seek what lies within."}`,
      world: world,
      rank: rankIdx,
      danger: danger + (isBoss?2:0),
      reward: (50 + RANKS.indexOf(rankIdx)*60) * (isBoss?2:1),
      xp: (30 + RANKS.indexOf(rankIdx)*40) * (isBoss?1.5:1),
      turns: 8 + RANKS.indexOf(rankIdx)*2,
      boss: isBoss,
      loot: generateLootPool(world, rankIdx, isBoss)
    });
  }
  return quests;
}

function generateLootPool(world, rank, isBoss){
  const pool = [];
  const rarities = isBoss ? ["Rare", "Epic", "Epic"] : ["Common", "Magic", "Rare"];
  const rarity = rarities[Math.floor(Math.random()*rarities.length)];
  
  Object.entries(ITEM_DATABASE).forEach(([name, item]) => {
    if(item.world === world && item.rarity === rarity){
      pool.push(name);
    }
  });
  
  return pool.length > 0 ? pool : Object.keys(ITEM_DATABASE).slice(0, 3);
}

function chooseQuest(quest){
  const maxRank = S.rank + 1;
  if(RANKS.indexOf(quest.rank) > maxRank){
    return addLog("Your guild rank is too low for this contract.");

  if(S.energy < 20){
    return addLog("You are exhausted. Rest first.");
  }
  
  modal(`
    <h2>${quest.name}</h2>
    <p class="muted">${quest.desc}</p>
    <div class="world-visual">
      <div style="font-size:32px">${WORLDS[quest.world].emoji}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:5px">${WORLDS[quest.world].name}</div>
    </div>
    <div class="reward-box">

        <div><span class="muted small">Danger</span><br><b class="danger-stars">${"⭐".repeat(quest.danger)}</b></div>

    <button class="primary" onclick="startQuest('${quest.id}')">Accept Contract</button><br><br>
    <button class="secondary" onclick="closeModal()">Cancel</button>

}

function startQuest(questId){
  closeModal();
  let quest = null;
  
  for(let world of S.worldUnlocked){
    const quests = generateQuestsForWorld(world);
    quest = quests.find(q => q.id === questId);
    if(quest) break;
  }
  
  if(!quest) return;
  
  S.energy -= 20;
  
  const c = CLASSES[S.profession];
  const guildBonus = GUILDS[S.guild].bonus;
  
  let p = {
    hp: c.hp + S.level*8 + (S.equipment.armor||0)*8 + guildBonus.maxHp||0,
    atk: c.atk + S.level*1.7 + (S.equipment.weapon||0)*2 + (guildBonus.atk||0),
    def: c.def + (S.equipment.armor||0)*2 + (guildBonus.def||0),
    spd: c.spd + S.stats.dex/5,
    mag: c.mag + S.level + (guildBonus.mag||0),
    crit: c.crit + (S.equipment.accessory||0) + S.stats.luck/10
  };
  
  let enemy = {...ENEMIES[Math.min(ENEMIES.length-1, Math.max(0, quest.danger-1))]};
  enemy.hp = enemy.hp + S.rank*12 + (quest.boss?30:0);
  enemy.atk = enemy.atk + S.rank*2;
  
  let log = [];
  let turn = 0;
  let playerHp = p.hp;
  let enemyHp = enemy.hp;
  
  log.push(`<b>Battle Start: ${enemy.name} ${enemy.emoji}</b>`);
  
  while(playerHp > 0 && enemyHp > 0 && turn < quest.turns*2){
    turn++;
    let playerFirst = p.spd >= enemy.spd;
    
    if((turn%2===1 && playerFirst) || (turn%2===0 && !playerFirst)){
      let crit = Math.random()*100 < p.crit;
      let dmg = Math.max(1, Math.round(p.atk - enemy.def*0.55) * (crit?1.5:1));
      enemyHp -= dmg;
      
      if(crit){
        log.push(`<span class="crit-hit">💥 CRITICAL HIT!</span> You deal <span class="damage-number">${dmg}</span> damage!`);
      } else {
        log.push(`You hit ${enemy.name} for <span class="damage-number">${dmg}</span>.`);
      }
    } else {
      let dodge = Math.random()*100 < (S.profession==="Rogue"?18:6);
      if(dodge){
        log.push(`🛡️ You dodge ${enemy.name}'s attack!`);
      } else {
        let dmg = Math.max(1, Math.round(enemy.atk - p.def*0.45));
        playerHp -= dmg;
        log.push(`${enemy.name} strikes you for <span class="damage-number">${dmg}</span> damage.`);
      }
    }
  }
  
  let win = playerHp > 0 && enemyHp <= 0;
  
  if(win){
    let bonus = quest.boss ? Math.round(quest.reward*1.8) : quest.reward;
    S.gold += bonus;
    gainXP(quest.xp);
    S.rp += quest.boss ? 28 : 12;
    S.quests++;
    S.wins++;
    S.profXp += Math.round(quest.xp*0.7);
    S.storyProgress += quest.boss ? 3 : 1;
    
    if(S.profXp >= S.profLevel*100 && S.profLevel < 10){
      S.profXp = 0;
      S.profLevel++;
      if(S.profLevel === 10){
        S.mastery++;
        addLog(`<span class="gold">🎖️ ${S.profession} MASTERY ACHIEVED!</span>`);
      } else {
        addLog(`${S.profession} advanced to profession level ${S.profLevel}.`);
      }
    }
    
    rankUp();
    
    // Loot!
    if(quest.loot && quest.loot.length > 0){
      const lootChance = quest.boss ? 0.95 : 0.50;
      if(Math.random() < lootChance){
        const lootItem = quest.loot[Math.floor(Math.random()*quest.loot.length)];
        S.gear.push({...ITEM_DATABASE[lootItem], name: lootItem});
        log.push(`<span class="good">💎 LOOT FOUND: ${lootItem}</span>`);
      }
    }
    
    log.push(`<span class="good">✅ Contract Complete!</span> Earned <span class="gold">${Math.round(bonus)}g</span>, <span class="blue">${Math.round(quest.xp)} XP</span>`);
    addLog(`<span class="good">Contract: ${quest.name} completed!</span>`);
  } else {
    S.losses++;
    log.push(`<span class="bad">❌ You were defeated.</span>`);
    addLog(`<span class="bad">Contract failed...</span>`);
  }
  
  save();
  combatModal(quest, log, win);
}

function combatModal(quest, logs, win){
  modal(`
    <h2>${win?"⚔️ Victory!":"💀 Defeat"}</h2>
    <div class="log">${logs.map(x=>`<div>${x}</div>`).join("")}</div>
    <br>
    <button class="primary" onclick="closeModal();render()">Return</button>
  `);
}

function equipGear(i){
  if(!S.gear[i]) return;
  let g = S.gear[i];
  if(g.slot === "weapon") S.equipment.weapon = g.atk;
  else if(g.slot === "armor") S.equipment.armor = g.def;
  else if(g.slot === "accessory") S.equipment.accessory = g.crit;
  
  S.gear.splice(i, 1);
  addLog(`Equipped: ${g.name}`);
  save();
  render();
}

function setProf(p){
  if(S.level < 3){
    addLog("Professions unlock at Level 3.");
    return;
  }
  S.profession = p;
  S.profLevel = 1;
  S.profXp = 0;
  S.unlockedAbilities = {};
  checkAbilityUnlocks();
  addLog(`Profession changed to ${p}.`);
  save();
  render();
}

function checkGuildRequirements(guildName){
  const req = GUILDS[guildName].req;
  return S.level >= req.level && S.rp >= req.rp && S.profession === req.class;
}

function joinGuild(guildName){
  if(!checkGuildRequirements(guildName)){
    const req = GUILDS[guildName].req;
    let unmet = [];
    if(S.level < req.level) unmet.push(`Level ${req.level}`);
    if(S.profession !== req.class) unmet.push(`${req.class} class`);
    if(S.rp < req.rp) unmet.push(`${req.rp} Rank Points`);
    
    addLog(`Cannot join ${guildName}. Requires: ${unmet.join(", ")}`);
    return;
  }
  
  S.guild = guildName;
  addLog(`<span class="purple">🎖️ Joined the ${guildName} guild!</span>`);
  save();
  render();
}

      <div class="card">
        <h3>Chapter III: ${STORY_CHAPTERS.chapter3.title}</h3>
        <div class="story-text">${STORY_CHAPTERS.chapter3.text}</div>
        <div style="text-align:center;margin-top:15px">
          <div style="font-size:48px;margin:10px 0">🌀</div>
          <p class="muted">The final battle approaches...</p>
        </div>
      </div>
    ` : `<div class="card"><p class="muted">Locked: ${Math.max(0, 80 - S.storyProgress)} progress points remaining</p></div>`}
  `;
}

function settings(){
  return `
    <div class="card featured">
      <h2>⚙️ Settings & Info</h2>
      <p class="muted small">Manage your game data and progress.</p>
    </div>
    
    <div class="card">
      <h3>Save Management</h3>
      <button class="secondary" onclick="exportSave()" style="width:100%">📥 Export Save</button>
      <p class="muted small" style="margin-top:10px">Your progress is automatically saved to your browser.</p>
    </div>
    
    <div class="card">
      <h3>Statistics</h3>
      <div class="grid">
        <div class="stat"><span>Total Levels</span><b>${S.level}</b></div>
        <div class="stat"><span>Battles Won</span><b class="good">${S.wins}</b></div>
        <div class="stat"><span>Battles Lost</span><b class="bad">${S.losses}</b></div>
        <div class="stat"><span>Professions Mastered</span><b>${S.mastery}</b></div>
      </div>
    </div>
    
    <div class="card">
      <h3>About</h3>
      <p class="muted small">The Adventurers Guild — Enhanced Reimagined is a fan-made browser RPG with an expanded story, richer progression, and meaningful choices.</p>
      <p class="muted small">Completely offline. No blockchain. No NFTs. Just pure adventure.</p>
    </div>
    
    <div class="card">
      <button class="secondary" onclick="reset()" style="width:100%;color:var(--bad)">🔄 Reset Save</button>
      <p class="muted small" style="margin-top:10px">This will delete all progress. This cannot be undone.</p>
    </div>
  `;
}

let tab = "guild";

function render(){
  const names = {
    guild: "🏛️ Guild",
    quests: "⚔️ Quests",
    party: "⚗️ Classes",
    guilds: "🎖️ Guilds",
    inventory: "🎒 Items",
    story: "📖 Story",
    settings: "⚙️ Settings"
  };
  
  document.getElementById("topSub").textContent = `${RANKS[S.rank]}-Rank • ${S.gold}g • 💪 ${S.level}`;
  
  const views = {
    guild: guild,
    quests: quests,
    party: party,
    guilds: guilds,
    inventory: inventory,
    story: story,
    settings: settings
  };
  
  document.getElementById("view").innerHTML = views[tab]();
  
  document.getElementById("tabs").innerHTML = Object.keys(names).map(k => 
    `<button class="${tab===k?"active":""}" onclick="tab='${k}';render()">${names[k]}</button>`
  ).join("");
}

// Initialize game
if(!localStorage.getItem("tag-enhanced-started")){
  createCharacter();
  localStorage.setItem("tag-enhanced-started", "true");
} else {
  render();
}
</script>
</body>
</html>
