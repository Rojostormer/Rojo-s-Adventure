<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROJO'S ADVENTURE - NEO-GEO MVS EDITION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--panel:#12121c;--panel2:#1a1a28;--gold:#ffcc00;--neored:#ff0033;
  --neoblue:#00d9ff;--neogreen:#00ff66;--neopurple:#d000ff;--neoorange:#ff6600;
  --text:#ffffff;--muted:#9090b0;--good:#00ff66;--bad:#ff0033;--blue:#00d9ff;
  --purple:#d000ff;--orange:#ff6600;--cyan:#00f0ff;--panel-border:#ffcc00;--panel-border2:#3d3d5c
}
*{box-sizing:border-box}
html{image-rendering:pixelated}
body{margin:0;background:var(--bg);color:var(--text);font-family:'VT323',ui-monospace,Consolas,monospace;font-size:18px;overflow-x:hidden;letter-spacing:.02em;position:relative}

/* NEO-GEO CRT & CAB BEZEL EFFECTS */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0px,rgba(0,0,0,.25) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.85) 100%);
  box-shadow:inset 0 0 18px #000}

.pixel-font{font-family:'Press Start 2P',monospace}
button,input{font-family:'VT323',ui-monospace,Consolas,monospace;font-size:17px}
button{cursor:pointer}
.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:90px;position:relative;z-index:1;background:#0d0d14;border-left:4px solid #1a1a26;border-right:4px solid #1a1a26}

/* NEO-GEO MARQUEE TOP HEADER */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1e1e2e 0%,#0c0c14 100%);border-bottom:4px solid var(--gold);border-top:3px solid var(--neored);padding:10px 16px;box-shadow:0 6px 0 #000,0 10px 20px #000d;display:flex;flex-direction:column;gap:2px}
.neogeo-badge{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;letter-spacing:1px;background:#ff0033;padding:2px 6px;border-radius:2px;font-weight:bold;text-shadow:1px 1px 0 #000}
.neogeo-badge span{color:var(--gold)}
.title{font-family:'Press Start 2P',monospace;font-weight:bold;letter-spacing:.04em;font-size:16px;color:var(--gold);
  text-shadow:3px 3px 0 #880000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;text-transform:uppercase;margin-top:4px}
.subtitle{color:var(--neoblue);font-size:15px;font-family:'VT323',monospace;letter-spacing:.08em;text-transform:uppercase;text-shadow:1px 1px 0 #000}

.content{padding:14px}

/* NEO-GEO SYSTEM TABS */
.tabs{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#181824 0%,#09090e 100%);border-top:4px solid var(--gold);display:flex;justify-content:center;z-index:10;box-shadow:0 -6px 20px #000e}
.tabs button{max-width:110px;flex:1;background:#10101a;border:0;border-right:2px solid #000;color:var(--muted);padding:12px 2px 14px;font-family:'Press Start 2P',monospace;font-size:7px;letter-spacing:0;text-transform:uppercase;transition:all .1s}
.tabs button:hover{background:#1a1a2a;color:#fff}
.tabs button.active{color:var(--gold);background:linear-gradient(180deg,#2a1f0a 0%,#120e05 100%);border-top:3px solid var(--neored);text-shadow:0 0 6px #ffcc00aa}

/* NEO-GEO ARCADE PANELS & CARDS */
.card{background:var(--panel);border:3px solid var(--gold);padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 #000,inset 0 0 10px rgba(0,0,0,.8);position:relative;outline:2px solid #000}
.card::before{content:"";position:absolute;top:2px;left:2px;right:2px;height:2px;background:rgba(255,255,255,.15);pointer-events:none}
.card.featured{background:linear-gradient(135deg,#28141a 0%,#12121c 100%);border-color:var(--neored);box-shadow:5px 5px 0 #000,0 0 15px #ff003333}
.hero{background:linear-gradient(135deg,#2a1820 0%,#10101c 60%,#080810 100%);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
h2,h3,h4{margin:0 0 8px;font-family:'Press Start 2P',monospace;font-weight:normal;letter-spacing:0;text-shadow:2px 2px 0 #000}
h2{font-size:13px;color:var(--gold)}h3{font-size:10px;color:var(--neoblue)}h4{font-size:8px;color:var(--neogreen)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.blue{color:var(--neoblue)}
.purple{color:var(--neopurple)}
.good{color:var(--neogreen)}
.bad{color:var(--neored)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stat{background:var(--panel2);padding:10px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000;outline:1px solid #000}
.stat b{display:block;font-size:22px;font-family:'VT323',monospace;color:var(--text);text-shadow:1px 1px 0 #000}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:'Press Start 2P',monospace}

/* ARCADE HUD HEALTH & EXP BARS */
.bar{height:16px;background:#050508;border:2px solid #000;outline:1px solid var(--panel-border2);position:relative;overflow:hidden;background-image:repeating-linear-gradient(90deg,#000 0,#000 4px,#111 4px,#111 6px)}
.fill{height:100%;background:linear-gradient(180deg,#ffe680 0%,#ffcc00 50%,#b38f00 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.bar.blue .fill{background:linear-gradient(180deg,#80ebff 0%,#00d9ff 50%,#0088cc 100%)}
.bar.purple .fill{background:linear-gradient(180deg,#f080ff 0%,#d000ff 50%,#8800cc 100%)}
.bar.good .fill{background:linear-gradient(180deg,#80ffaa 0%,#00ff66 50%,#009933 100%)}

/* NEO-GEO CHUNKY PUSH BUTTONS */
button.primary{width:100%;border:3px solid #000;background:linear-gradient(180deg,#ffee66 0%,#ffcc00 50%,#cc9900 100%);color:#000;padding:12px;
  font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:0;text-transform:uppercase;font-weight:bold;
  box-shadow:0 4px 0 #886600,0 6px 0 #000;transition:all .05s;text-shadow:0 1px 0 #ffff99}
button.primary:hover{background:linear-gradient(180deg,#ffff80 0%,#ffd633 50%,#e6ab00 100%)}
button.primary:active{transform:translateY(4px);box-shadow:0 0 0 #000}

button.secondary{border:3px solid #000;background:linear-gradient(180deg,#ff4d4d 0%,#cc0000 100%);color:#fff;padding:9px 12px;font-size:14px;
  font-family:'Press Start 2P',monospace;font-size:8px;box-shadow:0 3px 0 #660000,0 5px 0 #000;transition:all .05s;text-transform:uppercase;letter-spacing:.03em;text-shadow:1px 1px 0 #000}
button.secondary:hover{background:linear-gradient(180deg,#ff6666 0%,#e60000 100%)}
button.secondary:active{transform:translateY(3px);box-shadow:0 0 0 #000}
button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}

/* QUEST BOARD CARDS */
.quest{border:3px solid #3d3d5c;padding:12px;margin:10px 0;background:#10101a;cursor:pointer;transition:all .15s;box-shadow:4px 4px 0 #000;outline:1px solid #000}
.quest:hover{background:#1a1a2b;border-color:var(--gold)}
.quest.boss{border-color:var(--neored);background:linear-gradient(135deg,#33000d 0%,#150006 100%);box-shadow:0 0 15px #ff003344,4px 4px 0 #000}

.tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7px;border:2px solid #536172;padding:4px 6px;color:#c7d0da;margin-right:5px;margin-bottom:5px;text-transform:uppercase;background:#000}
.tag.epic{border-color:var(--neopurple);color:#f0a0ff;background:#2a0038}
.tag.rare{border-color:var(--neoblue);color:#a0f0ff;background:#002b38}
.tag.magic{border-color:var(--neogreen);color:#a0ffa0;background:#003810}
.tag.boss{border-color:var(--neoorange);color:#ffda00;background:#4a1f00}

.log{max-height:300px;overflow:auto;font-size:16px;background:#050508;border:3px solid #000;outline:2px solid #2a2a3d;padding:10px;line-height:1.4}
.log div{padding:4px 0;border-bottom:1px solid #1a1a28}
.log div:last-child{border:0}

/* ARCADE MODAL OVERLAY */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modalbox{width:min(780px,100%);background:#101018;border-top:5px solid var(--gold);border-left:2px solid #222;border-right:2px solid #222;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 -10px 30px #000e,inset 0 1px 0 rgba(255,255,255,.2)}

.item{padding:10px;background:#181824;border:2px solid #3a3a58;margin:8px 0;box-shadow:3px 3px 0 #000}
.item:hover{background:#222234}
.small{font-size:13px}
.right{text-align:right}
input{width:100%;background:#08080d;border:3px solid #3a3a58;color:#fff;padding:11px;margin:8px 0;font-size:18px;outline:none}
input:focus{border-color:var(--gold)}

.avatar-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}
.avatar-option{padding:12px;border:3px solid #3a3a58;text-align:center;cursor:pointer;transition:all .15s;background:#0a0a10}
.avatar-option:hover{border-color:var(--neoblue);background:#121220}
.avatar-option.selected{border-color:var(--gold);background:#261d08;box-shadow:0 0 15px #ffcc0055,inset 0 0 10px #ffcc0022}
.avatar-emoji{font-size:40px;margin:6px 0;filter:drop-shadow(3px 3px 0 #000)}

.world-visual{background:linear-gradient(135deg,#20141a 0%,#0a0a12 100%);border:3px solid var(--panel-border2);padding:15px;margin:10px 0;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 15px #000}
.location-badge{display:inline-block;padding:6px 10px;background:rgba(0,217,255,.1);border:2px solid var(--neoblue);color:var(--neoblue);font-size:11px;margin:4px 4px 4px 0;text-transform:uppercase;letter-spacing:.05em;font-family:'Press Start 2P',monospace}

.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.equipment-slot{background:var(--panel2);padding:12px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000}
.equipment-slot b{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-family:'Press Start 2P',monospace}
.equipment-slot .item-name{color:var(--gold);font-size:16px;font-weight:600}

.ability-list{display:grid;gap:8px}
.ability-item{background:var(--panel2);padding:10px;border-left:4px solid var(--neoblue);border-top:2px solid #3a3a58;border-bottom:2px solid #3a3a58;border-right:2px solid #3a3a58}
.requirement-check{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.requirement-check.met{color:var(--neogreen)}
.requirement-check.unmet{color:var(--muted)}
.unlock-badge{display:inline-block;padding:3px 8px;background:rgba(255,102,0,.2);border:2px solid var(--neoorange);color:var(--neoorange);font-size:8px;margin-left:5px;font-family:'Press Start 2P',monospace}

.story-text{background:var(--panel2);padding:14px;border-left:5px solid var(--neoblue);border-top:2px solid #3a3a58;border-bottom:2px solid #3a3a58;border-right:2px solid #3a3a58;line-height:1.5;margin:10px 0;font-size:17px;box-shadow:inset 0 0 10px #000}

.damage-number{color:var(--neored);font-weight:bold;text-shadow:2px 2px 0 #000}
.heal-number{color:var(--neogreen);font-weight:bold;text-shadow:2px 2px 0 #000}
.crit-hit{animation:pulse 0.3s;color:var(--neoorange);font-weight:bold;text-shadow:2px 2px 0 #000}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

.skill-point-display{background:rgba(208,0,255,.15);border:2px solid var(--neopurple);padding:8px 12px;display:inline-block;color:var(--neopurple);font-weight:600;font-size:12px;margin:8px 0;text-transform:uppercase;font-family:'Press Start 2P',monospace}
.danger-stars{color:var(--neoorange);letter-spacing:2px}
.reward-box{background:rgba(255,204,0,.08);border:2px solid var(--gold);padding:12px;margin:10px 0;box-shadow:inset 0 0 10px #000}

.arcade-flicker{animation:flicker 2.4s infinite}
@keyframes flicker{0%,96%,100%{opacity:1}97%{opacity:.6}98%{opacity:1}99%{opacity:.7}}
.insert-coin{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);text-align:center;letter-spacing:.08em;text-shadow:2px 2px 0 #880000}
</style>
</head>

function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,20)}
function xpNeed(){return 100+S.level*50}

function gainXP(n){
  S.xp += n;
  while(S.xp >= xpNeed()){
    S.xp -= xpNeed();
    S.level++;
    S.stats.str += 1;
    S.stats.dex += 1;
    S.stats.vit += 1;
    S.stats.int += 1;
    S.stats.luck += 1;
    S.skillPoints += 1;
    addLog(`<span class="good">⭐ LEVEL UP! You are now Level ${S.level}!</span>`);
    checkAbilityUnlocks();
  }
}

function checkAbilityUnlocks(){
  const prof = S.profession;
  if(ABILITIES[prof]){
    ABILITIES[prof].forEach(a => {
      if(S.level >= a.level && !S.unlockedAbilities[a.name]){
        S.unlockedAbilities[a.name] = true;
        addLog(`<span class="purple">✨ New Ability Unlocked: ${a.name}</span>`);
      }
    });
  }
}

function rankUp(){
  while(S.rp >= 100){
    S.rp -= 100;
    if(S.rank < RANKS.length-1){
      S.rank++;
      addLog(`<span class="gold">🏅 Guild Promotion! You are now ${RANKS[S.rank]}-Rank.</span>`);
      if(S.rank >= 2 && !S.worldUnlocked.includes("forest")){
        S.worldUnlocked.push("forest");
        addLog(`<span class="blue">🗺️ New World Unlocked: Whisperwood Forest</span>`);
      }
      if(S.rank >= 4 && !S.worldUnlocked.includes("ruins")){
        S.worldUnlocked.push("ruins");
        addLog(`<span class="blue">🗺️ New World Unlocked: Forgotten Catacombs</span>`);
      }
      if(S.rank >= 5 && !S.worldUnlocked.includes("volcanic")){
        S.worldUnlocked.push("volcanic");
        addLog(`<span class="blue">🗺️ New World Unlocked: Scorched Crater</span>`);
      }
      if(S.rank >= 6 && !S.worldUnlocked.includes("void")){
        S.worldUnlocked.push("void");
        addLog(`<span class="blue">🗺️ The Void's Edge has opened...</span>`);
      }
    } else {
      addLog(`<span class="gold">👑 You have reached legendary status!</span>`);
      break;
    }
  }
}

function pickQuestEvent(world){
  const matches = QUEST_EVENTS.filter(e => e.trigger === world);
  if(matches.length === 0) return null;
  return matches[Math.floor(Math.random() * matches.length)];
}

function generateQuestsForWorld(world){
  const w = WORLDS[world];
  const questTypes = ["Patrol", "Beast Hunt", "Salvage", "Purge", "Expedition"];
  const questCount = Math.floor(Math.random()*2) + 3;
  const quests = [];
  
  for(let i = 0; i < questCount; i++){
    const type = questTypes[Math.floor(Math.random()*questTypes.length)];
    const rankIdx = w.quests[Math.floor(Math.random()*w.quests.length)];
    const isBoss = Math.random() < 0.2;
    const danger = RANKS.indexOf(rankIdx) + 1;
    
    const questEvent = (isBoss || Math.random() < 0.65) ? pickQuestEvent(world) : null;
    
    quests.push({
      id: `${world}-${i}-${Date.now()}-${Math.floor(Math.random()*99999)}`,
      name: `[${rankIdx}] ${type}: ${w.name}`,
      desc: `Venture into ${w.name}. ${isBoss?"Battle a legendary foe!":"Seek what lies within."}`,
      world: world,
      rank: rankIdx,
      danger: danger + (isBoss?2:0),
      reward: (50 + RANKS.indexOf(rankIdx)*60) * (isBoss?2:1),
      xp: (30 + RANKS.indexOf(rankIdx)*40) * (isBoss?1.5:1),
      turns: 8 + RANKS.indexOf(rankIdx)*2,
      boss: isBoss,
      loot: generateLootPool(world, rankIdx, isBoss),
      event: questEvent,
      eventChoice: null
    });
  }
  return quests;
}

function generateLootPool(world, rank, isBoss){
  const pool = [];
  const rarities = isBoss ? ["Rare", "Epic", "Epic"] : ["Common", "Magic", "Rare"];
  const rarity = rarities[Math.floor(Math.random()*rarities.length)];
  
  Object.entries(ITEM_DATABASE).forEach(([name, item]) => {
    if(item.world === world && item.rarity === rarity){
      pool.push(name);
    }
  });
  
  return pool.length > 0 ? pool : Object.keys(ITEM_DATABASE).slice(0, 3);
}

function showQuestEvent(quest){
  if(!quest || !quest.event) {
    initiateCombat(quest);
    return;
  }
  
  const event = quest.event;
  const choices = event.choices || [];
  
  if(choices.length === 0) {
    initiateCombat(quest);
    return;
  }
  
  modal(`
    <h2>⚠️ ${event.title}</h2>
    <p class="story-text">${event.desc}</p>
    <div style="display:grid;gap:10px;margin-top:15px">
      ${choices.map((choice, idx) => `
        <button class="primary" onclick="chooseQuestEvent('${quest.id}', ${idx})">
          <b>${choice.text}</b>
          <div class="muted small" style="margin-top:4px">${choice.desc}</div>
        </button>
      `).join("")}
    </div>
  `);
}

function chooseQuestEvent(questId, choiceIdx){
  closeModal();
  let quest = globalQuests.find(q => q.id === questId);
  if(!quest || !quest.event || !quest.event.choices) return addLog("Event data not found.");
  
  const choice = quest.event.choices[choiceIdx];
  if(!choice) return addLog("Choice not found.");
  
  quest.eventChoice = choice;
  
  combatState.eventBonus = {
    effect: choice.effect || "none"
  };
  
  addLog(`<span class="blue">You chose: ${choice.text}</span>`);
  initiateCombat(quest);
}

function startQuestById(questId){
  closeModal();
  let quest = globalQuests.find(q => q.id === questId);
  if(!quest) return addLog("Quest not found.");
  
  if(quest.event && !quest.eventChoice){
    showQuestEvent(quest);
  } else {
    initiateCombat(quest);
  }
}

function initiateCombat(quest){
  if(!quest){
    closeModal();
    addLog("<span class='bad'>Quest data missing. Try again from the board.</span>");
    render();
    return;
  }
  
  S.energy = Math.max(0, S.energy - Math.min(20, S.energy));
  
  const c = CLASSES[S.profession];
  const guildBonus = GUILDS[S.guild].bonus;
  
  const maxHp = c.hp + S.level*8 + (S.equipment.armor||0)*8 + (guildBonus.maxHp||0);
  
  const worldPool = BESTIARY[quest.world] || BESTIARY.forest;
  const baseEnemy = quest.boss
    ? (BOSSES[quest.world] || BOSSES.forest)
    : worldPool[Math.floor(Math.random() * worldPool.length)];
  
  combatState = {
    active: true,
    quest: quest,
    player: {
      name: S.name,
      hp: maxHp,
      maxHp: maxHp,
      atk: c.atk + S.level*1.7 + (S.equipment.weapon||0)*2 + (guildBonus.atk||0),
      def: c.def + (S.equipment.armor||0)*2 + (guildBonus.def||0),
      spd: c.spd + S.stats.dex/5,
      mag: c.mag + S.level + (guildBonus.mag||0),
      crit: c.crit + (S.equipment.accessory||0) + S.stats.luck/10
    },
    enemy: {
      ...baseEnemy,
      hp: baseEnemy.hp + S.rank*12 + Math.max(0, quest.danger-1)*4
    },
    turn: 0,
    log: [],
    defenderStance: false,
    defenderCooldown: 0,
    eventBonus: combatState.eventBonus || {}
  };
  
  combatState.enemy.maxHp = combatState.enemy.hp;
  combatState.enemy.atk = combatState.enemy.atk + S.rank * 1.5;
  
  combatState.log.push(`<b>⚔️ BATTLE START!</b>`);
  combatState.log.push(`Target: <b>${combatState.enemy.emoji} ${combatState.enemy.name}</b>`);
  combatState.log.push(`---`);
  
  renderCombatTurn();
}

    </div>

}

function playerAction(action){
  const p = combatState.player;
  const e = combatState.enemy;
  combatState.turn++;
  
  let playerDamage = 0;
  let playerLog = "";
  
  let damageMultiplier = 1;
  let defenseBonus = 0;
  
  if(combatState.eventBonus && combatState.eventBonus.effect){
    if(combatState.eventBonus.effect === 'power') damageMultiplier = 1.15;
    if(combatState.eventBonus.effect === 'mana') damageMultiplier = 1.20;
    if(combatState.eventBonus.effect === 'defense') defenseBonus = 0.15;
  }
  
  switch(action){
    case 'attack':
      const crit = Math.random() * 100 < p.crit;
      playerDamage = Math.max(1, Math.round((p.atk - e.def * 0.55) * damageMultiplier));
      if(crit) playerDamage = Math.round(playerDamage * 1.5);
      e.hp -= playerDamage;
      playerLog = crit 
        ? `<span class="crit-hit">💥 CRITICAL HIT!</span> You strike for <span class="damage-number">${playerDamage}</span>!`
        : `You attack! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
      
    case 'defend':
      combatState.defenderStance = true;
      combatState.defenderCooldown = 1;
      playerLog = `🛡️ You take a defensive stance! Defense +50% next turn.`;
      break;
      
    case 'spell':
      if(S.profession !== "Caster"){
        playerLog = `You cannot cast spells!`;
        break;
      }
      playerDamage = Math.max(1, Math.round((p.mag * 1.8 - e.def * 0.3) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `✨ You cast a powerful spell! <span class="damage-number">${playerDamage}</span> arcane damage!`;
      break;
      
    case 'backstab':
      if(S.profession !== "Rogue"){
        playerLog = `Only rogues can backstab!`;
        break;
      }
      playerDamage = Math.max(1, Math.round((p.atk * 1.8 - e.def * 0.4) * damageMultiplier));
      const backstabCrit = Math.random() * 100 < (p.crit + 20);
      if(backstabCrit) playerDamage = Math.round(playerDamage * 1.3);
      e.hp -= playerDamage;
      playerLog = backstabCrit
        ? `<span class="crit-hit">💀 LETHAL STRIKE!</span> <span class="damage-number">${playerDamage}</span> critical damage!`
        : `🗡️ You backstab for <span class="damage-number">${playerDamage}</span>!`;
      break;
      
    case 'power':
      if(S.profession !== "Fighter"){
        playerLog = `That requires Fighter training!`;
        break;
      }
      playerDamage = Math.max(1, Math.round((p.atk * 2.2 - e.def * 0.3) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `💪 You unleash a devastating power attack! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
      
    case 'fortify':
      if(S.profession !== "Defender"){
        playerLog = `That's a Defender ability!`;
        break;
      }
      combatState.defenderStance = true;
      combatState.defenderCooldown = 2;
      playerLog = `🏰 You fortify! Defense +75% for 2 turns!`;
      break;
      
    case 'ability':
      playerDamage = Math.max(1, Math.round((p.atk * 1.4 - e.def * 0.4) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `⚡ You use your ability! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
      
    case 'flee':
      const fleeChance = Math.random() * 100 < (S.profession === "Rogue" ? 60 : 30);
      if(fleeChance){
        playerLog = `🏃 You successfully escape from battle!`;
        combatState.log.push(playerLog);
        S.energy = Math.min(100, S.energy + 10);
        addLog("You fled from combat and recovered some energy.");
        save();
        closeModal();
        render();
        return;
      } else {
        playerLog = `🏃 Your escape attempt failed!`;
      }
      break;
  }
  
  combatState.log.push(playerLog);
  
  if(e.hp <= 0){
    finalizeCombat(true);
    return;
  }
  
  const enemyFleeChance = Math.random() * 100 < 5;
  if(enemyFleeChance){
    combatState.log.push(`${e.name} flees in terror!`);
    finalizeCombat(true);
    return;
  }
  
  let defenseReduction = 1 - defenseBonus;
  let enemyDamage = Math.max(1, Math.round((e.atk - (p.def * 0.45) * (1 + defenseBonus)) * defenseReduction));
  let dodged = Math.random() * 100 < (S.profession === "Rogue" ? 20 : 8);
  
  if(combatState.defenderStance && combatState.defenderCooldown > 0){
    enemyDamage = Math.round(enemyDamage * 0.25);
    combatState.defenderCooldown--;
    combatState.log.push(`🛡️ ${e.name}'s attack is deflected! <span class="damage-number">${enemyDamage}</span> damage`);
  } else if(dodged){
    combatState.log.push(`🛡️ You evade ${e.name}'s attack!`);
  } else {
    p.hp -= enemyDamage;
    combatState.log.push(`${e.name} attacks! <span class="damage-number">${enemyDamage}</span> damage to you!`);
  }
  
  combatState.defenderStance = false;
  
  if(p.hp <= 0){
    finalizeCombat(false);
    return;
  }
  
  renderCombatTurn();
}

function finalizeCombat(won){
  const quest = combatState.quest;
  const log = combatState.log;
  
  if(won){
    let bonus = quest.boss ? Math.round(quest.reward*1.8) : quest.reward;
    S.gold += bonus;
    gainXP(quest.xp);
    S.rp += quest.boss ? 28 : 12;
    S.quests++;
    S.wins++;
    S.profXp += Math.round(quest.xp*0.7);
    S.storyProgress += quest.boss ? 3 : 1;
    
    if(S.profXp >= S.profLevel*100 && S.profLevel < 10){
      S.profXp = 0;
      S.profLevel++;
      if(S.profLevel === 10){
        S.mastery++;
        addLog(`<span class="gold">🎖️ ${S.profession} MASTERY ACHIEVED!</span>`);
      } else {
        addLog(`${S.profession} advanced to profession level ${S.profLevel}.`);
      }
    }
    
    rankUp();
    
    if(quest.loot && quest.loot.length > 0){
      const lootChance = quest.boss ? 0.95 : 0.50;
      if(Math.random() < lootChance){
        const lootItem = quest.loot[Math.floor(Math.random()*quest.loot.length)];
        S.gear.push({...ITEM_DATABASE[lootItem], name: lootItem});
        log.push(`<span class="good">💎 LOOT FOUND: ${lootItem}</span>`);
      }
    }
    
    log.push(`<span class="good">---</span>`);
    log.push(`<span class="good">✅ VICTORY!</span> Earned <span class="gold">${Math.round(bonus)}g</span>, <span class="blue">${Math.round(quest.xp)} XP</span>`);
    addLog(`<span class="good">Contract: ${quest.name} completed!</span>`);
  } else {
    S.losses++;
    const defeatXp = Math.round(quest.xp * 0.3);
    gainXP(defeatXp);
    log.push(`<span class="bad">---</span>`);
    log.push(`<span class="bad">❌ YOU WERE DEFEATED</span>`);
    log.push(`<span class="blue">Earned ${defeatXp} XP from the experience.</span>`);
    addLog(`<span class="bad">Contract failed... but you learned from it.</span>`);
  }
  
  const idx = globalQuests.findIndex(q => q.id === quest.id);
  if(idx !== -1) globalQuests.splice(idx, 1);
  
  save();
  combatState.active = false;
  combatResultModal(quest, log, won);
}

function equipGear(i){
  if(!S.gear[i]) return;
  let g = S.gear[i];
  if(g.slot === "weapon") S.equipment.weapon = g.atk;
  else if(g.slot === "armor") S.equipment.armor = g.def;
  else if(g.slot === "accessory") S.equipment.accessory = g.crit;
  
  S.gear.splice(i, 1);
  addLog(`Equipped: ${g.name}`);
  save();
  render();
}

function setProf(p){
  if(S.level < 3){
    addLog("Professions unlock at Level 3.");
    return;
  }
  S.profession = p;
  S.profLevel = 1;
  S.profXp = 0;
  S.unlockedAbilities = {};
  checkAbilityUnlocks();
  addLog(`Profession changed to ${p}.`);
  save();
  render();
}

function checkGuildRequirements(guildName){
  const req = GUILDS[guildName].req;
  return S.level >= req.level && S.rp >= req.rp && S.profession === req.class;
}

function joinGuild(guildName){
  if(!checkGuildRequirements(guildName)){
    const req = GUILDS[guildName].req;
    let unmet = [];
    if(S.level < req.level) unmet.push(`Level ${req.level}`);
    if(S.profession !== req.class) unmet.push(`${req.class} class`);
    if(S.rp < req.rp) unmet.push(`${req.rp} Rank Points`);
    
    addLog(`Cannot join ${guildName}. Requires: ${unmet.join(", ")}`);
    return;
  }
  
  S.guild = guildName;
  addLog(`<span class="purple">🎖️ Joined the ${guildName} guild!</span>`);
  save();
  render();
}

    </div>
    
    ${S.gear.length === 0 
      ? `<div class="card"><p class="muted">No items yet. Complete quests to find equipment!</p></div>`
      : `<div class="card">
          <h3>📦 Your Gear</h3>
          ${S.gear.map((g, i) => `
            <div class="item">
              <div class="row between">
                <div style="flex:1">
                  <b style="color:${
                    g.rarity === 'Epic' ? 'var(--neopurple)' : 
                    g.rarity === 'Rare' ? 'var(--neoblue)' : 
                    g.rarity === 'Magic' ? 'var(--neogreen)' : '#fff'
                  }">${g.name}</b>
                  <div class="muted small">${g.rarity} ${g.slot}</div>
                  <div class="muted small" style="margin-top:4px">
                    ${g.atk ? '+'+g.atk+' ATK ' : ''}${g.def ? '+'+g.def+' DEF ' : ''}${g.crit ? '+'+g.crit+' CRIT' : ''}
                  </div>
                </div>
                <button class="secondary" onclick="equipGear(${i})">Equip</button>
              </div>
            </div>
          `).join("")}
        </div>`
    }
  `;
}

function story(){
  return `
    <div class="card featured">
      <h2>📖 STORY PROGRESS</h2>
      <p class="muted small">Your actions shape the fate of the realm. Progress through the narrative with each victory.</p>
    </div>
    
    <div class="card">
      <h3>PROGRESS: ${Math.round(S.storyProgress/10)}%</h3>
      <div class="bar blue"><div class="fill" style="width:${Math.min(100, S.storyProgress/10)}%"></div></div>
    </div>
    
    <div class="card">
      <h3>Prologue: ${STORY_CHAPTERS.intro.title}</h3>
      <div class="story-text">${STORY_CHAPTERS.intro.text}</div>
    </div>
    
    ${S.storyProgress >= 20 ? `
      <div class="card">
        <h3>Chapter I: ${STORY_CHAPTERS.chapter1.title}</h3>
        <div class="story-text">${STORY_CHAPTERS.chapter1.text}</div>
      </div>
    ` : `<div class="card"><p class="muted">Locked: ${20 - S.storyProgress} progress points remaining</p></div>`}
    
    ${S.storyProgress >= 50 ? `
      <div class="card">
        <h3>Chapter II: ${STORY_CHAPTERS.chapter2.title}</h3>
        <div class="story-text">${STORY_CHAPTERS.chapter2.text}</div>
      </div>
    ` : `<div class="card"><p class="muted">Locked: ${Math.max(0, 50 - S.storyProgress)} progress points remaining</p></div>`}
    
    ${S.storyProgress >= 80 ? `
      <div class="card">
        <h3>Chapter III: ${STORY_CHAPTERS.chapter3.title}</h3>
        <div class="story-text">${STORY_CHAPTERS.chapter3.text}</div>
        <div style="text-align:center;margin-top:15px">
          <div style="font-size:48px;margin:10px 0">🌀</div>
          <p class="muted">The final battle approaches...</p>
        </div>
      </div>
    ` : `<div class="card"><p class="muted">Locked: ${Math.max(0, 80 - S.storyProgress)} progress points remaining</p></div>`}
  `;
}

function settings(){
  return `
    <div class="card featured">
      <h2>⚙️ SYSTEM OPTIONS</h2>
      <p class="muted small">Manage save data and hardware options.</p>
    </div>
    
    <div class="card">
      <h3>Save Management</h3>
      <button class="secondary" onclick="exportSave()" style="width:100%">📥 EXPORT SAVE</button>
      <p class="muted small" style="margin-top:10px">Your progress is automatically saved to browser memory.</p>
    </div>
    
    <div class="card">
      <h3>STATISTICS</h3>
      <div class="grid">
        <div class="stat"><span>LEVEL</span><b>${S.level}</b></div>
        <div class="stat"><span>WINS</span><b class="good">${S.wins}</b></div>
        <div class="stat"><span>LOSSES</span><b class="bad">${S.losses}</b></div>
        <div class="stat"><span>MASTERIES</span><b>${S.mastery}</b></div>
      </div>
    </div>
    
    <div class="card">
      <h3>ABOUT SYSTEM</h3>
      <p class="muted small">ROJO'S ADVENTURE (NEO-GEO MVS SPEC) is an arcade RPG inspired by SNK NeoGeo classic visuals, rich storyline progression, and tactical combat.</p>
      <p class="muted small">100% Offline • High performance • Pure arcade action.</p>
    </div>
    
    <div class="card">
      <button class="secondary" onclick="reset()" style="width:100%;color:var(--neored)">🔄 RESET MEMORY CARD</button>
      <p class="muted small" style="margin-top:10px">This will clear all game progress permanently.</p>
    </div>
  `;
}

let tab = "guild";

function render(){
  const names = {
    guild: "🏛️ GUILD",
    quests: "⚔️ QUESTS",
    party: "⚗️ CLASS",
    guilds: "🎖️ FACTION",
    inventory: "🎒 ITEMS",
    story: "📖 STORY",
    settings: "⚙️ SYSTEM"
  };
  
  document.getElementById("topSub").textContent = `RANK: ${RANKS[S.rank]} • ${S.gold} GOLD • LEVEL ${S.level}`;
  
  const views = {
    guild: guild,
    quests: quests,
    party: party,
    guilds: guilds,
    inventory: inventory,
    story: story,
    settings: settings
  };
  
  document.getElementById("view").innerHTML = views[tab]();
  
  document.getElementById("tabs").innerHTML = Object.keys(names).map(k => 
    `<button class="${tab===k?"active":""}" onclick="tab='${k}';render()">${names[k]}</button>`
  ).join("");
}

// Initialize game
if(!localStorage.getItem("tag-enhanced-started")){
  createCharacter();
  localStorage.setItem("tag-enhanced-started", "true");
} else {
  render();
}
</script>
</body>
</html>
