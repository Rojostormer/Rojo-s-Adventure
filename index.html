<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RPG Quest Game</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
    nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    nav button { padding: 8px 16px; cursor: pointer; }
    .tab { display: none; }
    .tab.active { display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; }
    .btn { background: #0066cc; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn-danger { background: #cc0000; }
    #console { background: #222; color: #00ff66; padding: 10px; font-family: monospace; height: 100px; overflow-y: auto; margin-top: 20px; border-radius: 4px; }
    .stat-bar { background: #e0e0e0; border-radius: 4px; height: 12px; width: 100%; margin-top: 4px; overflow: hidden; }
    .stat-fill { height: 100%; background: #0066cc; width: 100%; }
    .energy-fill { background: #e6a100; }
  </style>
</head>
<body>

<div class="container">
  <h2>Quest Adventurer</h2>
  <div id="hud-summary"></div>

  <nav>
    <button onclick="showTab('quests')">Quests</button>
    <button onclick="showTab('character')">Character Sheet</button>
    <button onclick="showTab('shop')">Store</button>
    <button onclick="showTab('guilds')">Guilds</button>
  </nav>

  <div id="tab-quests" class="tab active">
    <div class="grid">
      <div>
        <h3>Available Quests</h3>
        <div id="quest-list"></div>
      </div>
      <div>
        <h3>Quest Progress</h3>
        <div id="quest-display" class="card">
          <p>Select a quest to begin.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-character" class="tab">
    <div class="grid">
      <div>
        <h3>Equipped Items</h3>
        <div id="equipped-list"></div>
      </div>
      <div>
        <h3>Backpack Inventory</h3>
        <div id="inventory-list"></div>
      </div>
    </div>
  </div>

  <div id="tab-shop" class="tab">
    <h3>Item Shop</h3>
    <div id="shop-list" class="grid"></div>
  </div>

  <div id="tab-guilds" class="tab">
    <h3>Guild Hall</h3>
    <p>Guilds are open to all adventurers regardless of classification.</p>
    <div id="guild-list" class="grid"></div>
  </div>

  <div id="console">> Game loaded. Ready for questing.</div>
</div>

<script>
  const state = {
    hp: 100,
    maxHp: 100,
    energy: 10,
    maxEnergy: 10,
    gold: 50,
    baseAtk: 10,
    baseDef: 2,
    guild: 'None',
    equipment: { weapon: null, armor: null },
    inventory: [
      { id: 'pot_1', name: 'Health Potion', type: 'usable', heal: 30, price: 15, desc: 'Restores 30 HP.' }
    ],
    activeQuest: null,
    questStep: 0
  };

  const shopItems = [
    { id: 'pot_1', name: 'Health Potion', type: 'usable', heal: 30, price: 15, desc: 'Restores 30 HP instantly.' },
    { id: 'bomb_1', name: 'Fire Bomb', type: 'usable', damage: 40, price: 25, desc: 'Can be thrown in quests to deal 40 splash damage.' },
    { id: 'wpn_1', name: 'Iron Sword', type: 'weapon', atk: 8, price: 40, desc: '+8 Attack Power' },
    { id: 'arm_1', name: 'Chainmail Vest', type: 'armor', def: 6, price: 50, desc: '+6 Defense Power' }
  ];

  const guilds = [
    { name: 'Warriors Guild', fee: 30, desc: 'Open to everyone seeking martial strength.' },
    { name: 'Mages Circle', fee: 30, desc: 'Open to everyone interested in the arcane.' },
    { name: 'Shadow League', fee: 30, desc: 'Open to all stealth and speed enthusiasts.' }
  ];

  const quests = [
    {
      id: 'q1',
      title: 'Clear the Goblin Cave',
      energyCost: 3,
      nodes: [
        {
          text: 'Stage 1: You enter a dark cave and encounter 3 Goblin Scouts blocking the passage.',
          options: [
            { text: 'Attack with weapon', dmg: 15, next: 1 },
            { text: 'Throw Fire Bomb from inventory', reqItem: 'bomb_1', consume: true, dmg: 0, next: 1 }
          ]
        },
        {
          text: 'Stage 2: Pushing deeper, a heavy Goblin Brute charges at you with a heavy club!',
          options: [
            { text: 'Block and counter-attack', dmg: 25, next: 2 },
            { text: 'Use Health Potion before fighting', reqItem: 'pot_1', consume: true, heal: 30, dmg: 10, next: 2 }
          ]
        },
        {
          text: 'Stage 3: You reach the Goblin Shaman performing a dark spell over a treasure chest.',
          options: [
            { text: 'Interrupt shaman and finish the fight', dmg: 30, finish: true, gold: 50 }
          ]
        }
      ]
    },
    {
      id: 'q2',
      title: 'Bandit Camp Ambush',
      energyCost: 4,
      nodes: [
        {
          text: 'Stage 1: You locate the bandit perimeter guards near the treeline.',
          options: [
            { text: 'Fight through the guard post', dmg: 20, next: 1 }
          ]
        },
        {
          text: 'Stage 2: The Bandit Leader emerges with two armored lieutenants.',
          options: [
            { text: 'Engage the leader in a direct duel', dmg: 35, finish: true, gold: 80 }
          ]
        }
      ]
    }
  ];

  function log(msg) {
    const c = document.getElementById('console');
    c.innerHTML += `<div>> ${msg}</div>`;
    c.scrollTop = c.scrollHeight;
  }

  function getAtk() {
    return state.baseAtk + (state.equipment.weapon ? state.equipment.weapon.atk : 0);
  }

  function getDef() {
    return state.baseDef + (state.equipment.armor ? state.equipment.armor.def : 0);
  }

  function showTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${id}`).classList.add('active');
    render();
  }

  function rest() {
    if (state.gold < 10) return log('Not enough gold to rest at the inn (10g required).');
    state.gold -= 10;
    state.hp = state.maxHp;
    state.energy = state.maxEnergy;
    log('Rested at the inn. HP and Energy restored.');
    render();
  }

  function startQuest(qId) {
    const q = quests.find(x => x.id === qId);
    
    // FIX: ENERGY STRICTLY REQUIRED TO PLAY QUEST
    if (state.energy < q.energyCost) {
      log(`Cannot start quest! Requires ${q.energyCost} Energy (You have ${state.energy}).`);
      return;
    }

    state.energy -= q.energyCost;
    state.activeQuest = q;
    state.questStep = 0;
    log(`Started quest: ${q.title}. Spent ${q.energyCost} Energy.`);
    render();
  }

  function answerQuest(opt) {
    const q = state.activeQuest;
    
    // Check item requirement
    if (opt.reqItem) {
      const idx = state.inventory.findIndex(i => i.id === opt.reqItem);
      if (idx === -1) {
        log(`Missing required item to choose this option.`);
        return;
      }
      if (opt.consume) state.inventory.splice(idx, 1);
    }

    if (opt.heal) {
      state.hp = Math.min(state.maxHp, state.hp + opt.heal);
      log(`Healed for ${opt.heal} HP.`);
    }

    // Dynamic damage calculation using Defense
    if (opt.dmg > 0) {
      const taken = Math.max(2, opt.dmg - getDef());
      state.hp = Math.max(0, state.hp - taken);
      log(`Took ${taken} damage in combat (Mitigated by ${getDef()} DEF).`);
    }

    if (state.hp <= 0) {
      log('You were defeated in quest combat! Rest at the inn to heal.');
      state.activeQuest = null;
      render();
      return;
    }

    if (opt.finish) {
      state.gold += opt.gold;
      log(`Quest Complete! Rewarded ${opt.gold} Gold.`);
      state.activeQuest = null;
    } else {
      state.questStep = opt.next;
    }

    render();
  }

  // FIX: SHOW EQUIPPED ITEMS & UNEQUIP WITHOUT LOSING
  function equip(invIndex) {
    const item = state.inventory[invIndex];
    if (!['weapon', 'armor'].includes(item.type)) return;

    if (state.equipment[item.type]) {
      state.inventory.push(state.equipment[item.type]);
    }

    state.equipment[item.type] = item;
    state.inventory.splice(invIndex, 1);
    log(`Equipped ${item.name}.`);
    render();
  }

  function unequip(type) {
    if (!state.equipment[type]) return;
    const item = state.equipment[type];
    state.inventory.push(item);
    state.equipment[type] = null;
    log(`Unequipped ${item.name} and placed back into inventory.`);
    render();
  }

  function buy(itemId) {
    const item = shopItems.find(i => i.id === itemId);
    if (state.gold < item.price) return log('Not enough gold!');
    
    state.gold -= item.price;
    state.inventory.push({ ...item });
    log(`Purchased ${item.name}. Added to Character Sheet inventory.`);
    render();
  }

  // FIX: GUILDS UNRESTRICTED BY CLASSIFICATION
  function joinGuild(name, fee) {
    if (state.gold < fee) return log('Not enough gold to join guild.');
    state.gold -= fee;
    state.guild = name;
    log(`Joined ${name}!`);
    render();
  }

  function render() {
    // HUD
    document.getElementById('hud-summary').innerHTML = `
      <div style="margin-bottom:15px;">
        <strong>HP:</strong> ${state.hp}/${state.maxHp} | 
        <strong>Energy:</strong> ${state.energy}/${state.maxEnergy} | 
        <strong>ATK:</strong> ${getAtk()} | 
        <strong>DEF:</strong> ${getDef()} | 
        <strong>Gold:</strong> ${state.gold}g | 
        <strong>Guild:</strong> ${state.guild}
        <button class="btn" style="margin-left:10px;" onclick="rest()">Rest at Inn (10g)</button>
        <div class="stat-bar"><div class="stat-fill" style="width:${(state.hp/state.maxHp)*100}%"></div></div>
        <div class="stat-bar"><div class="stat-fill energy-fill" style="width:${(state.energy/state.maxEnergy)*100}%"></div></div>
      </div>
    `;

    // Quests
    const qList = document.getElementById('quest-list');
    qList.innerHTML = '';
    quests.forEach(q => {
      qList.innerHTML += `
        <div class="card">
          <strong>${q.title}</strong> (Cost: ${q.energyCost} Energy)<br>
          <button class="btn" onclick="startQuest('${q.id}')" ${state.energy < q.energyCost ? 'disabled' : ''}>
            ${state.energy < q.energyCost ? 'Low Energy' : 'Start Quest'}
          </button>
        </div>
      `;
    });

    const qDisplay = document.getElementById('quest-display');
    if (state.activeQuest) {
      const node = state.activeQuest.nodes[state.questStep];
      let opts = '';
      node.options.forEach((o) => {
        const hasItem = !o.reqItem || state.inventory.some(i => i.id === o.reqItem);
        opts += `<button class="btn" style="display:block; margin-top:8px;" onclick='answerQuest(${JSON.stringify(o)})' ${!hasItem ? 'disabled' : ''}>${o.text} ${o.reqItem ? '(Requires Item)' : ''}</button>`;
      });
      qDisplay.innerHTML = `<h4>${state.activeQuest.title}</h4><p>${node.text}</p>${opts}`;
    } else {
      qDisplay.innerHTML = '<p>Select a quest to begin.</p>';
    }

    // Equipment & Inventory
    const eqList = document.getElementById('equipped-list');
    eqList.innerHTML = `
      <div class="card">Weapon: ${state.equipment.weapon ? state.equipment.weapon.name + ' (+' + state.equipment.weapon.atk + ' ATK)' : 'None'} 
        ${state.equipment.weapon ? `<button class="btn" onclick="unequip('weapon')">Unequip</button>` : ''}</div>
      <div class="card">Armor: ${state.equipment.armor ? state.equipment.armor.name + ' (+' + state.equipment.armor.def + ' DEF)' : 'None'} 
        ${state.equipment.armor ? `<button class="btn" onclick="unequip('armor')">Unequip</button>` : ''}</div>
    `;

    const invList = document.getElementById('inventory-list');
    invList.innerHTML = '';
    state.inventory.forEach((item, idx) => {
      invList.innerHTML += `
        <div class="card">
          <strong>${item.name}</strong> - ${item.desc}<br>
          ${['weapon', 'armor'].includes(item.type) ? `<button class="btn" onclick="equip(${idx})">Equip</button>` : ''}
        </div>
      `;
    });

    // Shop
    const sList = document.getElementById('shop-list');
    sList.innerHTML = '';
    shopItems.forEach(i => {
      sList.innerHTML += `
        <div class="card">
          <strong>${i.name}</strong> (${i.price}g)<br>
          <small>${i.desc}</small><br>
          <button class="btn" onclick="buy('${i.id}')" style="margin-top:5px;">Buy</button>
        </div>
      `;
    });

    // Guilds
    const gList = document.getElementById('guild-list');
    gList.innerHTML = '';
    guilds.forEach(g => {
      gList.innerHTML += `
        <div class="card">
          <strong>${g.name}</strong> (Fee: ${g.fee}g)<br>
          <small>${g.desc}</small><br>
          <button class="btn" onclick="joinGuild('${g.name}', ${g.fee})" ${state.guild === g.name ? 'disabled' : ''}>
            ${state.guild === g.name ? 'Member' : 'Join Guild'}
          </button>
        </div>
      `;
    });
  }

  render();
</script>
</body>
</html>
