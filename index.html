<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROJO'S ADVENTURE - NEO-GEO MVS EDITION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--panel:#12121c;--panel2:#1a1a28;--gold:#ffcc00;--neored:#ff0033;
  --neoblue:#00d9ff;--neogreen:#00ff66;--neopurple:#d000ff;--neoorange:#ff6600;
  --text:#ffffff;--muted:#9090b0;--good:#00ff66;--bad:#ff0033;--blue:#00d9ff;
  --purple:#d000ff;--orange:#ff6600;--cyan:#00f0ff;--panel-border:#ffcc00;--panel-border2:#3d3d5c
}
*{box-sizing:border-box}
html{image-rendering:pixelated}
body{margin:0;background:var(--bg);color:var(--text);font-family:'VT323',ui-monospace,Consolas,monospace;font-size:18px;overflow-x:hidden;letter-spacing:.02em;position:relative}

body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0px,rgba(0,0,0,.25) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.85) 100%);
  box-shadow:inset 0 0 18px #000}

.pixel-font{font-family:'Press Start 2P',monospace}
button,input{font-family:'VT323',ui-monospace,Consolas,monospace;font-size:17px}
button{cursor:pointer}
.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:90px;position:relative;z-index:1;background:#0d0d14;border-left:4px solid #1a1a26;border-right:4px solid #1a1a26}

.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1e1e2e 0%,#0c0c14 100%);border-bottom:4px solid var(--gold);border-top:3px solid var(--neored);padding:10px 16px;box-shadow:0 6px 0 #000,0 10px 20px #000d;display:flex;flex-direction:column;gap:2px}
.neogeo-badge{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;letter-spacing:1px;background:#ff0033;padding:2px 6px;border-radius:2px;font-weight:bold;text-shadow:1px 1px 0 #000}
.neogeo-badge span{color:var(--gold)}
.title{font-family:'Press Start 2P',monospace;font-weight:bold;letter-spacing:.04em;font-size:16px;color:var(--gold);
  text-shadow:3px 3px 0 #880000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;text-transform:uppercase;margin-top:4px}
.subtitle{color:var(--neoblue);font-size:15px;font-family:'VT323',monospace;letter-spacing:.08em;text-transform:uppercase;text-shadow:1px 1px 0 #000}

.content{padding:14px}

.tabs{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#181824 0%,#09090e 100%);border-top:4px solid var(--gold);display:flex;justify-content:center;z-index:10;box-shadow:0 -6px 20px #000e}
.tabs button{max-width:85px;flex:1;background:#10101a;border:0;border-right:2px solid #000;color:var(--muted);padding:12px 2px 14px;font-family:'Press Start 2P',monospace;font-size:6px;letter-spacing:0;text-transform:uppercase;transition:all .1s}
.tabs button:hover{background:#1a1a2a;color:#fff}
.tabs button.active{color:var(--gold);background:linear-gradient(180deg,#2a1f0a 0%,#120e05 100%);border-top:3px solid var(--neored);text-shadow:0 0 6px #ffcc00aa}

.card{background:var(--panel);border:3px solid var(--gold);padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 #000,inset 0 0 10px rgba(0,0,0,.8);position:relative;outline:2px solid #000}
.card::before{content:"";position:absolute;top:2px;left:2px;right:2px;height:2px;background:rgba(255,255,255,.15);pointer-events:none}
.card.featured{background:linear-gradient(135deg,#28141a 0%,#12121c 100%);border-color:var(--neored);box-shadow:5px 5px 0 #000,0 0 15px #ff003333}
.hero{background:linear-gradient(135deg,#2a1820 0%,#10101c 60%,#080810 100%);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
h2,h3,h4{margin:0 0 8px;font-family:'Press Start 2P',monospace;font-weight:normal;letter-spacing:0;text-shadow:2px 2px 0 #000}
h2{font-size:13px;color:var(--gold)}h3{font-size:10px;color:var(--neoblue)}h4{font-size:8px;color:var(--neogreen)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.blue{color:var(--neoblue)}
.purple{color:var(--neopurple)}
.good{color:var(--neogreen)}
.bad{color:var(--neored)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.stat{background:var(--panel2);padding:10px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000;outline:1px solid #000}
.stat b{display:block;font-size:22px;font-family:'VT323',monospace;color:var(--text);text-shadow:1px 1px 0 #000}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:'Press Start 2P',monospace}

.bar{height:16px;background:#050508;border:2px solid #000;outline:1px solid var(--panel-border2);position:relative;overflow:hidden;background-image:repeating-linear-gradient(90deg,#000 0,#000 4px,#111 4px,#111 6px)}
.fill{height:100%;background:linear-gradient(180deg,#ffe680 0%,#ffcc00 50%,#b38f00 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width 0.2s}
.bar.blue .fill{background:linear-gradient(180deg,#80ebff 0%,#00d9ff 50%,#0088cc 100%)}
.bar.purple .fill{background:linear-gradient(180deg,#f080ff 0%,#d000ff 50%,#8800cc 100%)}

button.primary{width:100%;border:3px solid #000;background:linear-gradient(180deg,#ffee66 0%,#ffcc00 50%,#cc9900 100%);color:#000;padding:12px;
  font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:0;text-transform:uppercase;font-weight:bold;
  box-shadow:0 4px 0 #886600,0 6px 0 #000;transition:all .05s;text-shadow:0 1px 0 #ffff99}
button.primary:hover{background:linear-gradient(180deg,#ffff80 0%,#ffd633 50%,#e6ab00 100%)}
button.primary:active{transform:translateY(4px);box-shadow:0 0 0 #000}

button.secondary{border:3px solid #000;background:linear-gradient(180deg,#ff4d4d 0%,#cc0000 100%);color:#fff;padding:8px 10px;
  font-family:'Press Start 2P',monospace;font-size:7.5px;box-shadow:0 3px 0 #660000,0 5px 0 #000;transition:all .05s;text-transform:uppercase;letter-spacing:.03em;text-shadow:1px 1px 0 #000}
button.secondary:hover{background:linear-gradient(180deg,#ff6666 0%,#e60000 100%)}
button.secondary.sell-btn{background:linear-gradient(180deg,#4dff88 0%,#009933 100%);box-shadow:0 3px 0 #004d1a,0 5px 0 #000;color:#000;text-shadow:none;font-weight:bold}
button.secondary.sell-btn:hover{background:linear-gradient(180deg,#80ffaa 0%,#00cc44 100%)}

button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}

.quest{border:3px solid #3d3d5c;padding:12px;margin:10px 0;background:#10101a;cursor:pointer;transition:all .15s;box-shadow:4px 4px 0 #000;outline:1px solid #000}
.quest:hover{background:#1a1a2b;border-color:var(--gold)}
.quest.boss{border-color:var(--neored);background:linear-gradient(135deg,#33000d 0%,#150006 100%);box-shadow:0 0 15px #ff003344,4px 4px 0 #000}

.tag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7px;border:2px solid #536172;padding:4px 6px;color:#c7d0da;margin-right:5px;margin-bottom:5px;text-transform:uppercase;background:#000}
.tag.boss{border-color:var(--neoorange);color:#ffda00;background:#4a1f00}

.log{max-height:220px;overflow-y:auto;font-size:16px;background:#050508;border:3px solid #000;outline:2px solid #2a2a3d;padding:10px;line-height:1.4}
.log div{padding:4px 0;border-bottom:1px solid #1a1a28}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modalbox{width:min(780px,100%);background:#101018;border-top:5px solid var(--gold);border-left:2px solid #222;border-right:2px solid #222;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 -10px 30px #000e,inset 0 1px 0 rgba(255,255,255,.2)}

.item{padding:10px;background:#181824;border:2px solid #3a3a58;margin:8px 0;box-shadow:3px 3px 0 #000}
.item:hover{background:#222234}
.small{font-size:13px}

.world-card{background:#12121e;border:3px solid #3a3a58;padding:12px;margin:10px 0;box-shadow:4px 4px 0 #000;transition:all .15s}
.world-card.active{border-color:var(--gold);background:linear-gradient(135deg,#241a08 0%,#10101a 100%)}
.world-card.locked{opacity:.5;filter:grayscale(0.8)}

.story-box{background:linear-gradient(135deg,#1c102b 0%,#0c0617 100%);border:2px solid var(--neopurple);padding:12px;margin:10px 0;box-shadow:inset 0 0 10px #000}

.equipment-grid{display:grid;grid-template-columns:1fr;gap:10px}
.equipment-slot{background:var(--panel2);padding:12px;border:2px solid #3a3a58;box-shadow:3px 3px 0 #000;display:flex;justify-content:space-between;align-items:center}
.equipment-slot b{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;font-family:'Press Start 2P',monospace}
.equipment-slot .item-name{color:var(--gold);font-size:17px;font-weight:600}

.damage-number{color:var(--neored);font-weight:bold;text-shadow:2px 2px 0 #000}
.crit-hit{animation:pulse 0.3s;color:var(--neoorange);font-weight:bold;text-shadow:2px 2px 0 #000}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.reward-box{background:rgba(255,204,0,.08);border:2px solid var(--gold);padding:12px;margin:10px 0;box-shadow:inset 0 0 10px #000}
.arcade-flicker{animation:flicker 2.4s infinite}
@keyframes flicker{0%,96%,100%{opacity:1}97%{opacity:.6}98%{opacity:1}99%{opacity:.7}}
.insert-coin{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);text-align:center;letter-spacing:.08em;text-shadow:2px 2px 0 #880000}
</style>
</head>

function addLog(t){ S.log.unshift(t); S.log = S.log.slice(0, 20); }
function getCurrentLevel(){ return S.classProgress[S.activeClass].level; }
function getCurrentXP(){ return S.classProgress[S.activeClass].xp; }
function xpNeed(){ return 120 + getCurrentLevel() * 70; }

function gainXP(n){
  let prog = S.classProgress[S.activeClass];
  prog.xp += n;
  while(prog.xp >= (120 + prog.level * 70)){
    prog.xp -= (120 + prog.level * 70);
    prog.level++;
    S.stats.str += 2;
    S.stats.dex += 2;
    S.stats.vit += 2;
    S.stats.int += 2;
    addLog(`<span class="good">⭐ CLASS LEVEL UP! ${S.activeClass} reached Level ${prog.level}! Attributes increased.</span>`);
  }
}

// CLASS SWITCHING SYSTEM
function switchClass(newClass){
  if(S.activeClass === newClass) return;
  S.activeClass = newClass;
  const matchAv = AVATARS.find(a => a.class === newClass);
  if(matchAv) S.avatar = matchAv;

  addLog(`<span class="purple">🔄 Switched Class to ${newClass}! Active Level: ${S.classProgress[newClass].level}</span>`);
  
  // Unequip items that violate class restriction
  ["weapon", "armor", "accessory", "spell_skill", "spell_spell"].forEach(slot => {
    const item = S.equipment[slot];
    if(item && item.classReq && item.classReq !== "Any" && item.classReq !== S.activeClass){
      unequipSlot(slot, false);
      addLog(`<span class="bad">⚠️ ${item.name} unequipped automatically (Requires ${item.classReq}).</span>`);
    }
  });

  save();
  render();
}

function rankUp(){
  while(S.rp >= 100){
    S.rp -= 100;
    if(S.rank < RANKS.length - 1){
      S.rank++;
      addLog(`<span class="gold">🏅 Guild Rank Promotion! Promoted to ${RANKS[S.rank]}-Rank!</span>`);
      const rankWorlds = ["safe", "forest", "swamp", "ruins", "glacier", "volcanic", "void", "abyss"];
      if(S.rank < rankWorlds.length && !S.worldUnlocked.includes(rankWorlds[S.rank])){
        const prevLocKey = rankWorlds[S.rank - 1];
        if(S.bossesDefeated.includes(prevLocKey)){
          S.worldUnlocked.push(rankWorlds[S.rank]);
          addLog(`<span class="blue">🗺️ NEW REGION UNLOCKED: ${WORLDS[rankWorlds[S.rank]].name}! Use Travel tab to move there.</span>`);
        } else {
          addLog(`<span class="bad">🔒 NEW REGION LOCKED: Must defeat boss of ${WORLDS[prevLocKey].name} to progress!</span>`);
        }
      }
    } else { break; }
  }
}

function sellGearItem(index){
  const item = S.gear[index];
  if(!item) return;
  const sellValue = Math.round((item.price || 50) * 0.55);
  S.gold += sellValue;
  S.gear.splice(index, 1);
  addLog(`<span class="good">💰 Sold ${item.name} for +${sellValue} Gold.</span>`);
  save();
  render();
}

function sellConsumableItem(itemKey){
  const count = S.consumables[itemKey] || 0;
  if(count <= 0) return;
  const item = STORE_CONSUMABLES[Object.keys(STORE_CONSUMABLES).find(k => STORE_CONSUMABLES[k].id === itemKey) || itemKey];
  const sellVal = Math.round((item ? item.price : 30) * 0.5);
  S.consumables[itemKey]--;
  S.gold += sellVal;
  addLog(`<span class="good">💰 Sold 1x ${itemKey} for +${sellVal} Gold.</span>`);
  save();
  render();
}

function equipItemFromGear(gearIndex){
  const item = S.gear[gearIndex];
  if(!item) return;

  const slot = item.slot;
  if(S.equipment[slot]){
    unequipSlot(slot, false);
  }

  S.equipment[slot] = item;
  S.gear.splice(gearIndex, 1);
  addLog(`<span class="good">Equipped ${item.name} (${slot.toUpperCase()}).</span>`);
  save();
  render();
}

function unequipSlot(slot, triggerRender = true){
  const item = S.equipment[slot];
  if(!item) return;

  S.gear.push(item);
  S.equipment[slot] = null;
  addLog(`<span class="muted">Unequipped ${item.name}. Returned to Storage.</span>`);
  save();
  if(triggerRender) render();
}

// ===== STORE PURCHASING =====
function buyStoreItem(itemKey, isConsumable = false){
  if(isConsumable){
    const item = STORE_CONSUMABLES[itemKey];
    if(!item) return;
    if(S.gold < item.price){
      addLog(`<span class="bad">❌ Not enough Gold! Costs ${item.price}g.</span>`);
      render();
      return;
    }
    S.gold -= item.price;
    S.consumables[item.id] = (S.consumables[item.id] || 0) + 1;
    addLog(`<span class="good">🛒 Purchased ${item.emoji} ${itemKey}. Saved to Inventory.</span>`);
  } else {
    const item = ITEM_DATABASE[itemKey];
    if(!item) return;
    if(item.rarity === "Epic" || item.rarity === "Legendary"){
      addLog(`<span class="bad">❌ Rare/Powerful item! Drops only from quests.</span>`);
      render();
      return;
    }
    if(S.gold < item.price){
      addLog(`<span class="bad">❌ Not enough Gold! Costs ${item.price}g.</span>`);
      render();
      return;
    }
    S.gold -= item.price;
    S.gear.push({ ...item, name: itemKey });
    addLog(`<span class="good">🛒 Purchased ${itemKey}. Saved to Inventory!</span>`);
  }
  save();
  render();
}

let globalQuests = [];

function generateQuestsForCurrentLocation(){
  const wKey = S.currentLocation;
  const w = WORLDS[wKey];
  const list = [];
  const count = 3;
  
  for(let i = 0; i < count; i++){
    const isBoss = (i === count - 1);
    const tmpl = QUEST_TEMPLATES[Math.floor(Math.random() * QUEST_TEMPLATES.length)];
    const energyCost = 15 + w.danger * 4;

    const totalWaves = isBoss ? w.waveCount + 1 : w.waveCount;

    list.push({
      id: `q-${wKey}-${i}-${Date.now()}`,
      name: isBoss ? `[CHAPTER BOSS] ${w.name} Siege` : `${tmpl.name}`,
      desc: isBoss ? STORY_CHAPTERS[wKey].bossGoal : tmpl.desc,
      eventText: tmpl.event,
      world: wKey,
      rank: RANKS[Math.min(RANKS.length - 1, w.danger - 1)],
      energyCost: energyCost,
      danger: w.danger + (isBoss ? 2 : 0),
      waves: totalWaves,
      reward: Math.round((60 + w.danger * 45) * (isBoss ? 2.5 : 1)),
      xp: Math.round((50 + w.danger * 40) * (isBoss ? 2.2 : 1)),
      boss: isBoss
    });
  }
  return list;
}

    addLog(`<span class="bad">❌ Out of energy (${S.energy}/${quest.energyCost}). Rest at the Inn!</span>`);
    render();
    return;

  save();

}

function initiateMultiWaveCombat(quest){
  const c = CLASSES[S.activeClass];
  const cLevel = getCurrentLevel();
  const gBonus = GUILDS[S.guild].bonus;
  
  // CLASS-SPECIFIC GEAR EFFICIENCY CHECK (100% IF MATCHING CLASS, 50% IF MISMATCHED)
  const calculateItemBonus = (item, prop) => {
    if(!item || !item[prop]) return 0;
    if(item.classReq && item.classReq !== "Any" && item.classReq !== S.activeClass){
      return item[prop] * 0.5; // 50% reduced efficiency if mismatched
    }
    return item[prop];
  };

  const wAtk = calculateItemBonus(S.equipment.weapon, "atk");
  const aDef = calculateItemBonus(S.equipment.armor, "def");
  const aMaxHp = calculateItemBonus(S.equipment.armor, "maxHp");
  const accCrit = calculateItemBonus(S.equipment.accessory, "crit");
  const accAtk = calculateItemBonus(S.equipment.accessory, "atk");
  const accMaxHp = calculateItemBonus(S.equipment.accessory, "maxHp");

  const maxHp = c.hp + cLevel * 14 + (gBonus.maxHp || 0) + S.stats.vit * 4 + aMaxHp + accMaxHp;
  const maxMp = c.mp + cLevel * 6 + (gBonus.maxMp || 0) + S.stats.int * 3;
  const totalAtk = c.atk + cLevel * 3 + wAtk + accAtk + (gBonus.atk || 0) + S.stats.str * 1.1;
  const totalDef = c.def + cLevel * 2 + aDef + (gBonus.def || 0);
  const totalCrit = c.crit + accCrit + (gBonus.crit || 0) + S.stats.dex * 0.4;

  combatState = {
    active: true,
    quest: quest,
    currentWave: 1,
    totalWaves: quest.waves,
    tempAtkBuff: 0,
    tempDefBuff: 0,
    player: {
      hp: maxHp,
      maxHp: maxHp,
      mp: maxMp,
      maxMp: maxMp,
      atk: totalAtk,
      def: totalDef,
      crit: totalCrit,
      mag: c.mag + cLevel * 2.5 + (gBonus.mag || 0)
    },
    enemy: {},
    log: []
  };

  combatState.log.push(`<b>📖 ${quest.name}</b> (${quest.waves} Waves Total)`);
  combatState.log.push(`<span class="muted">${quest.eventText}</span>`);
  
  spawnWaveEnemy();
  renderCombatUI();
}

function spawnWaveEnemy(){
  const q = combatState.quest;
  const isFinalBoss = (combatState.currentWave === combatState.totalWaves && q.boss);
  
  let baseEnemy;
  if(isFinalBoss){
    baseEnemy = BOSSES[q.world] || BOSSES.safe;
  } else {
    const pool = BESTIARY[q.world] || BESTIARY.safe;
    baseEnemy = pool[Math.floor(Math.random() * pool.length)];
  }

  const waveScale = 1 + (combatState.currentWave - 1) * 0.25;
  combatState.enemy = {
    name: baseEnemy.name,
    emoji: baseEnemy.emoji,
    maxHp: Math.round(baseEnemy.hp * waveScale),
    hp: Math.round(baseEnemy.hp * waveScale),
    atk: Math.round(baseEnemy.atk * waveScale),
    def: Math.round(baseEnemy.def * waveScale)
  };

  combatState.log.push(`<span class="bad">⚠️ WAVE ${combatState.currentWave}/${combatState.totalWaves}: ${combatState.enemy.emoji} ${combatState.enemy.name} engages!</span>`);
}

function useCombatConsumable(itemKey){
  const p = combatState.player;
  const count = S.consumables[itemKey] || 0;
  if(count <= 0) return;

  if(itemKey === 'pot_hp' || itemKey === 'pot_ghp' || itemKey === 'pot_elixir'){
    const item = STORE_CONSUMABLES[Object.keys(STORE_CONSUMABLES).find(k => STORE_CONSUMABLES[k].id === itemKey)];
    S.consumables[itemKey]--;
    const healVal = item.value;
    p.hp = Math.min(p.maxHp, p.hp + healVal);
    combatState.log.push(`<span class="good">🧪 Consumed healing potion! Restored ${healVal} HP. (${Math.round(p.hp)}/${p.maxHp} HP)</span>`);
  } else if(itemKey === 'pot_mp' || itemKey === 'pot_gmp'){

function execCombatTurn(action){
  const p = combatState.player;
  const e = combatState.enemy;
  const effectiveAtk = p.atk + combatState.tempAtkBuff;
  const effectiveDef = p.def + combatState.tempDefBuff;

  const skillItem = S.equipment.spell_skill;
  const spellItem = S.equipment.spell_spell;

  let playerDamage = 0;
  let guardActive = false;

  if(action === 'attack'){
    const isCrit = Math.random() * 100 < p.crit;
    const baseDmg = Math.max(5, effectiveAtk - e.def * 0.45);
    playerDamage = Math.round(isCrit ? baseDmg * 1.7 : baseDmg);
    e.hp -= playerDamage;
    combatState.log.push(isCrit 
      ? `<span class="crit-hit">💥 CRITICAL STRIKE!</span> Dealt <span class="damage-number">${playerDamage}</span> damage!`
      : `You strike the enemy for <span class="damage-number">${playerDamage}</span> damage.`);
  } else if(action === 'skill'){
    if(!skillItem || p.mp < skillItem.cost){
      combatState.log.push(`<span class="bad">❌ Not enough Mana for ${skillItem?skillItem.name:'Skill'}!</span>`);
      renderCombatUI();
      return;
    }
    p.mp -= skillItem.cost;
    const pwr = skillItem.power || 1.3;
    playerDamage = Math.round(Math.max(10, effectiveAtk * pwr - e.def * 0.3));
    e.hp -= playerDamage;
    combatState.log.push(`💥 Used <b>${skillItem.name.replace("Scroll: ","")}</b>! Dealt <span class="damage-number">${playerDamage}</span> damage! (-${skillItem.cost} MP)`);
  } else if(action === 'spell'){
    if(!spellItem || p.mp < spellItem.cost){
      combatState.log.push(`<span class="bad">❌ Not enough Mana for ${spellItem?spellItem.name:'Spell'}!</span>`);
      renderCombatUI();
      return;
    }
    p.mp -= spellItem.cost;

    if(spellItem.name.includes("First Aid") || spellItem.name.includes("Iron Will")){
      const healAmt = Math.round(p.mag * 2.2 + 30);
      p.hp = Math.min(p.maxHp, p.hp + healAmt);
      combatState.log.push(`<span class="good">✨ Cast <b>${spellItem.name.replace("Scroll: ","")}</b>! Restored ${healAmt} HP! (-${spellItem.cost} MP)</span>`);
    } else {
      const pwr = spellItem.power || 2.0;
      playerDamage = Math.round(Math.max(15, p.mag * pwr + effectiveAtk * 0.6 - e.def * 0.2));
      e.hp -= playerDamage;
      combatState.log.push(`<span class="purple">✨ Cast <b>${spellItem.name.replace("Scroll: ","")}</b>! Dealt <span class="damage-number">${playerDamage}</span> magic damage! (-${spellItem.cost} MP)</span>`);
    }
  } else if(action === 'guard'){
    guardActive = true;
    combatState.log.push(`🛡️ You take up a defensive guard stance! (60% damage reduction)`);
  } else if(action === 'flee'){
    addLog(`Fled from quest. Energy was consumed.`);
    closeModal();
    render();
    return;
  }

  if(e.hp <= 0){
    combatState.log.push(`<span class="good">🎯 Slain ${e.name}!</span>`);
    if(combatState.currentWave < combatState.totalWaves){
      combatState.currentWave++;
      spawnWaveEnemy();
      renderCombatUI();
      return;
    } else {
      finishQuestVictory();
      return;
    }
  }

  let enemyDamage = Math.max(4, e.atk - effectiveDef * 0.4);
  if(guardActive) enemyDamage = Math.round(enemyDamage * 0.4);

  const isCurrentUnbeatenZone = !S.bossesDefeated.includes(combatState.quest.world);
  if(isCurrentUnbeatenZone){
    const maxAllowedDamage = p.maxHp * 0.40;
    enemyDamage = Math.min(enemyDamage, maxAllowedDamage);
  }

  p.hp -= enemyDamage;
  combatState.log.push(`<span class="bad">💥 ${e.name} attacks back! Took <span class="damage-number">${Math.round(enemyDamage)}</span> damage!</span>`);

  if(p.hp <= 0){
    finishQuestDefeat();
    return;
  }

  renderCombatUI();
}

function finishQuestVictory(){
  const q = combatState.quest;
  S.gold += q.reward;
  gainXP(q.xp);
  S.rp += q.boss ? 35 : 18;
  S.wins++;

  if(q.boss && !S.bossesDefeated.includes(q.world)){
    S.bossesDefeated.push(q.world);
    addLog(`<span class="gold">👑 BOSS SLAIN: ${WORLDS[q.world].name} defeated! Next region unlocked!</span>`);
  }

  rankUp();

  // CHANCE FOR ITEM & SPELL SCROLL DROPS
  if(Math.random() < 0.10){
    const rarityTiers = { Common: 1, Magic: 2, Rare: 3, Epic: 4, Legendary: 5 };
    const maxTier = rarityTiers[WORLDS[q.world].maxRarity] || 1;
    const poolKeys = Object.keys(ITEM_DATABASE).filter(k => {
      const itemTier = rarityTiers[ITEM_DATABASE[k].rarity] || 1;
      return itemTier <= maxTier;
    });
    
    if(poolKeys.length > 0){
      const dropKey = poolKeys[Math.floor(Math.random()*poolKeys.length)];
      const dropItem = ITEM_DATABASE[dropKey];
      S.gear.push({ ...dropItem, name: dropKey });
      addLog(`<span class="purple">🎁 VICTORY DROP: Found ${dropKey}! Saved to Inventory.</span>`);
    }
  }

  addLog(`<span class="good">🏆 QUEST CLEARED: ${q.name}! Won +${q.reward}g & +${q.xp} XP!</span>`);
  globalQuests = globalQuests.filter(x => x.id !== q.id);
  save();

  modal(`
    <h2>🏆 QUEST VICTORY!</h2>
    <p>You conquered all <b>${q.waves} waves</b> of enemy forces in ${WORLDS[q.world].name}!</p>
    <div class="reward-box">
      <div>Gold Earned: <b class="gold">+${q.reward}g</b></div>
      <div>XP Gained: <b class="blue">+${q.xp} XP</b></div>
    </div>
    <button class="primary" onclick="closeModal();render()">Return to HQ</button>
  `);
}

function finishQuestDefeat(){
  S.losses++;
  addLog(`<span class="bad">💀 DEFEATED on Quest: ${combatState.quest.name}. Upgrade gear, equip spells, or use potions!</span>`);
  save();

  modal(`
    <h2 class="bad">💀 QUEST FAILED</h2>
    <p>Your hero fell in combat against enemy waves. Equip class-specific gear or stock up on potions!</p>
    <button class="primary" onclick="closeModal();render()">Return to Base</button>
  `);
}

      ${Object.entries(STORE_CONSUMABLES).map(([name, item]) => `
        <div class="item row between">
          <div>
            <b>${item.emoji} ${name}</b>
            <div class="muted small">${item.desc}</div>
            <div class="gold small">Price: ${item.price}g | Owned: ${S.consumables[item.id] || 0}</div>
          </div>
          <button class="secondary" onclick="buyStoreItem('${name}', true)">Buy</button>
        </div>
      `).join("")}
    </div>

    <div class="card">
      <h3>⚔️ CLASS GEAR & SPELL SCROLLS</h3>
      ${availableItems.map(([name, item]) => `
        <div class="item row between">
          <div>
            <b>${name}</b> (${item.rarity} ${item.slot.toUpperCase()})
            <div class="purple small">Class Req: ${item.classReq || 'Any'}</div>
            <div class="muted small">${item.desc}</div>
            <div class="gold small">Price: ${item.price}g</div>
          </div>
          <button class="secondary" onclick="buyStoreItem('${name}', false)">Buy</button>
        </div>
      `).join("")}
    </div>
  `;
}

function viewInventory(){
  return `
    <div class="card featured">
      <h2>🎒 INVENTORY & SPELL MANAGEMENT</h2>
      <p class="muted small">Equip class-matched weapons/armor and equip spell scrolls into active combat slots!</p>
    </div>

    <div class="card">
      <h3>🧪 POTIONS & ELIXIRS</h3>
      <div class="grid">
        ${Object.entries(STORE_CONSUMABLES).map(([name, item]) => {
          const count = S.consumables[item.id] || 0;
          const sellVal = Math.round(item.price * 0.5);
          return `
            <div class="item">
              <b>${item.emoji} ${name}</b>: ${count}
              <div class="muted small">${item.desc}</div>
              ${count > 0 ? `
                <div style="display:flex;gap:4px;margin-top:4px">
                  ${item.type === 'energy' ? `<button class="secondary" onclick="useEnergyElixir('${item.id}')">Use</button>` : ''}
                  <button class="secondary sell-btn" onclick="sellConsumableItem('${item.id}')">Sell (+${sellVal}g)</button>
                </div>
              `:''}
            </div>
          `;
        }).join("")}
      </div>
    </div>

    <div class="card">
      <h3>⚔️ GEAR & SPELL SCROLL STORAGE (${S.gear.length} ITEMS)</h3>
      ${S.gear.length === 0 
        ? `<p class="muted">No items in storage.</p>`
        : S.gear.map((item, index) => {
            const sellVal = Math.round((item.price || 50) * 0.55);
            const isMatchingClass = !item.classReq || item.classReq === "Any" || item.classReq === S.activeClass;
            return `
              <div class="item row between">
                <div>
                  <b>${item.name}</b> (${item.slot.toUpperCase()})
                  <div class="${isMatchingClass ? 'good':'bad'} small">Class: ${item.classReq || 'Any'} ${!isMatchingClass?'(Mismatched: 50% penalty)':''}</div>
                  <div class="muted small">${item.desc}</div>
                </div>
                <div style="display:flex;gap:6px">
                  <button class="primary" onclick="equipItemFromGear(${index})" style="width:auto;padding:6px 12px">Equip</button>
                  <button class="secondary sell-btn" onclick="sellGearItem(${index})">Sell (+${sellVal}g)</button>
                </div>
              </div>
            `;
          }).join("")
      }
    </div>
  `;
}

function useEnergyElixir(id){
  if((S.consumables[id]||0) > 0){
    S.consumables[id]--;
    const boost = id === 'pot_maxeng' ? 100 : 50;
    S.energy = Math.min(100, S.energy + boost);
    addLog(`<span class="good">⚡ Restored +${boost} Stamina Energy!</span>`);
    save();
    render();
  }
}

function viewGuilds(){
  return `
    <div class="card featured">
      <h2>🎖️ FACTION GUILDS</h2>
      <p class="muted small">Join any guild once you reach the required Level and Rank Points!</p>
    </div>

    <div class="card">
      ${Object.entries(GUILDS).map(([gName, gData]) => {
        const canJoin = getCurrentLevel() >= gData.req.level && S.rp >= gData.req.rp;
        const isCurrent = S.guild === gName;

        return `
          <div class="item" style="border-left:4px solid ${isCurrent ? 'var(--gold)':'#3a3a58'}">
            <div class="row between">
              <div>
                <b>${gData.icon} ${gName} Guild</b>
                <div class="muted small">${gData.desc}</div>
                <div class="small muted" style="margin-top:4px">Requires: Level ${gData.req.level}, ${gData.req.rp} RP</div>
              </div>
              ${isCurrent 
                ? `<span class="tag gold">JOINED</span>`
                : `<button class="secondary" onclick="joinFactionGuild('${gName}')" ${canJoin?'':'disabled'}>Join</button>`
              }
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function joinFactionGuild(gName){
  S.guild = gName;
  addLog(`<span class="purple">🎖️ Joined the ${gName} Guild!</span>`);
  save();
  render();
}

function viewSettings(){
  return `
    <div class="card featured">
      <h2>⚙️ SYSTEM OPTIONS</h2>
    </div>
    <div class="card">
      <button class="secondary" onclick="resetGame()" style="width:100%;color:var(--neored)">🔄 RESET MEMORY CARD SAVE DATA</button>
    </div>
  `;
}

function resetGame(){
  if(confirm("Reset save data permanently?")){
    S = freshState();
    save();
    render();
  }
}

function modal(content){
  document.getElementById("modal").innerHTML = `<div class="modal"><div class="modalbox">${content}</div></div>`;
}

function closeModal(){
  document.getElementById("modal").innerHTML = "";
}

function createCharacterModal(){
  modal(`
    <p class="insert-coin arcade-flicker">🔴 NEO-GEO MVS SYSTEM 🔴</p>
    <h2 style="text-align:center;margin-top:10px">SELECT YOUR HERO CLASS</h2>
    
    <div class="avatar-selector" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0">
      ${AVATARS.map((a, i) => `
        <div class="item" onclick="selectAvatar(${i})" style="text-align:center;cursor:pointer">
          <div style="font-size:36px">${a.emoji}</div>
          <b>${a.name}</b>
          <div class="muted small">${a.class}</div>
        </div>
      `).join("")}
    </div>
    
    <label>Hero Name:</label>
    <input type="text" id="nameInput" value="Rojo" style="width:100%;background:#000;border:2px solid #3a3a58;color:#fff;padding:8px;margin:8px 0">
    
    <button class="primary" onclick="finishCharacterCreation()">▶ START ADVENTURE</button>
  `);
}

function selectAvatar(i){
  S.avatar = AVATARS[i];
  S.activeClass = AVATARS[i].class;
}

function finishCharacterCreation(){
  S.name = document.getElementById("nameInput").value || "Rojo";
  closeModal();
  save();
  render();
}

let tab = "guild";

function render(){
  document.getElementById("topSub").textContent = `LOC: ${WORLDS[S.currentLocation].name.toUpperCase()} • ${S.gold} GOLD • STAMINA: ${S.energy}/100`;

  const views = {
    guild: viewGuild,
    travel: viewTravel,
    quests: viewQuests,
    shop: viewShop,
    inventory: viewInventory,
    guilds: viewGuilds,
    settings: viewSettings
  };

  const navNames = {
    guild: "🏛️ HQ",
    travel: "🗺️ MAP",
    quests: "⚔️ QUESTS",
    shop: "🏪 SHOP",
    inventory: "🎒 ITEMS",
    guilds: "🎖️ FACTIONS",
    settings: "⚙️ SYS"
  };

  document.getElementById("view").innerHTML = views[tab]();

  document.getElementById("tabs").innerHTML = Object.keys(navNames).map(k => `
    <button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${navNames[k]}</button>
  `).join("");
}

if(!localStorage.getItem("rojo_mvs_save_v3")){
  createCharacterModal();
} else {
  render();
}
</script>
</body>
</html>
