:root{
  --bg:#050507;--panel:#160b0f;--panel2:#1f1015;--gold:#ffcf3f;--text:#f3ead9;--muted:#a2907a;

*{box-sizing:border-box}
html{image-rendering:pixelated}
body{margin:0;background:#050507;color:var(--text);font-family:'VT323',ui-monospace,Consolas,monospace;font-size:17px;overflow-x:hidden;letter-spacing:.02em;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;

.pixel-font{font-family:'Press Start 2P',monospace}
button,input{font-family:'VT323',ui-monospace,Consolas,monospace;font-size:16px}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:120px;position:relative;z-index:1}
.top{position:sticky;top:0;z-index:5;background:#0a0508;border-bottom:4px solid var(--gold);padding:14px 16px;box-shadow:0 4px 0 #000,0 4px 18px #000a}
.title{font-family:'Press Start 2P',monospace;font-weight:400;letter-spacing:.03em;font-size:15px;color:var(--gold);

.subtitle{color:var(--muted);font-size:14px;margin-top:6px;font-family:'VT323',monospace;letter-spacing:.06em;text-transform:uppercase}
.content{padding:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0a0508;border-top:4px solid var(--gold);display:flex;flex-wrap:wrap;justify-content:center;z-index:10;box-shadow:0 -4px 18px #000a}
.tabs button{min-width:75px;flex:1 1 20%;background:none;border:0;color:var(--muted);padding:10px 4px 12px;font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:0;text-transform:uppercase}
.tabs button.active{color:var(--gold);text-shadow:0 0 8px #ffcf3f88}
.card{background:var(--panel);border:2px solid var(--panel-border2);padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 #000;

.hero{background:radial-gradient(circle at 80% 10%,#3a1a20,#1c0d10 55%,#100809);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}

.muted{color:var(--muted)}
.gold{color:var(--gold)}
.blue{color:var(--blue)}
.purple{color:var(--purple)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);padding:10px;border:2px solid var(--panel-border);

button.primary:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
button.secondary{border:2px solid #000;background:#241318;color:#fff;padding:9px 11px;font-size:14px;

button.secondary:hover{background:#341b22}
button.secondary:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
button:disabled{opacity:.4;cursor:not-allowed}

.tag.rare{border-color:var(--cyan);color:#b3f7f7;background:#0e2f33}
.tag.magic{border-color:var(--blue);color:#c3e6ff;background:#0e2740}
.tag.boss{border-color:var(--orange);color:#ffe0b8;background:#3a1a04}

.small{font-size:13px}
.right{text-align:right}

.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.equipment-slot{background:var(--panel2);padding:12px;border:2px solid var(--panel-border)}

.requirement-check{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.requirement-check.met{color:var(--good)}
.requirement-check.unmet{color:var(--muted)}

.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.achievement{background:var(--panel2);padding:12px;border:2px solid var(--panel-border);text-align:center;opacity:.6}
.achievement.unlocked{opacity:1;background:rgba(62,224,106,.1);border-color:var(--good)}
.achievement-icon{font-size:32px;margin:5px 0}
.damage-number{color:var(--bad);font-weight:bold;text-shadow:1px 1px 0 #000}

.skill-point-display{background:rgba(199,96,255,.15);border:2px solid var(--purple);padding:8px 12px;display:inline-block;color:var(--purple);font-weight:600;font-size:13px;margin:8px 0;text-transform:uppercase}
.danger-stars{color:var(--orange);letter-spacing:2px}
.reward-box{background:rgba(255,207,63,.08);border:2px solid var(--gold);padding:10px;margin:8px 0}
.arcade-flicker{animation:flicker 2.4s infinite}

.insert-coin{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);text-align:center;letter-spacing:.05em}

</head>

function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,20)}
function xpNeed(){return 100+S.level*50}

function gainXP(n){
  S.xp += n;
  while(S.xp >= xpNeed()){
    S.xp -= xpNeed();
    S.level++;
    S.stats.str += 1;
    S.stats.dex += 1;
    S.stats.vit += 1;
    S.stats.int += 1;
    S.stats.luck += 1;
    S.skillPoints += 1;
    addLog(`<span class="good">⭐ LEVEL UP! You are now Level ${S.level}!</span>`);
    checkAbilityUnlocks();
  }
}

function checkAbilityUnlocks(){
  const prof = S.profession;
  if(ABILITIES[prof]){
    ABILITIES[prof].forEach(a => {
      if(S.level >= a.level && !S.unlockedAbilities[a.name]){
        S.unlockedAbilities[a.name] = true;
        addLog(`<span class="purple">✨ New Ability Unlocked: ${a.name}</span>`);
      }
    });
  }
}

function rankUp(){
  while(S.rp >= 100){
    S.rp -= 100;
    if(S.rank < RANKS.length-1){
      S.rank++;
      addLog(`<span class="gold">🏅 Guild Promotion! You are now ${RANKS[S.rank]}-Rank.</span>`);
      if(S.rank >= 2 && !S.worldUnlocked.includes("forest")){
        S.worldUnlocked.push("forest");
        addLog(`<span class="blue">🗺️ New World Unlocked: Whisperwood Forest</span>`);
      }
      if(S.rank >= 4 && !S.worldUnlocked.includes("ruins")){
        S.worldUnlocked.push("ruins");
        addLog(`<span class="blue">🗺️ New World Unlocked: Forgotten Catacombs</span>`);
      }
      if(S.rank >= 5 && !S.worldUnlocked.includes("volcanic")){
        S.worldUnlocked.push("volcanic");
        addLog(`<span class="blue">🗺️ New World Unlocked: Scorched Crater</span>`);
      }
      if(S.rank >= 6 && !S.worldUnlocked.includes("void")){
        S.worldUnlocked.push("void");
        addLog(`<span class="blue">🗺️ The Void's Edge has opened...</span>`);
      }
    } else {
      addLog(`<span class="gold">👑 You have reached legendary status!</span>`);
      break;
    }
  }
}

function pickQuestEvent(world){
  const matches = QUEST_EVENTS.filter(e => e.trigger === world);
  if(matches.length === 0) return null;
  return matches[Math.floor(Math.random() * matches.length)];
}

function generateQuestsForWorld(world){
  const w = WORLDS[world];
  const questTypes = ["Patrol", "Beast Hunt", "Salvage", "Purge", "Expedition"];
  const questCount = Math.floor(Math.random()*2) + 3;
  const quests = [];
  
  for(let i = 0; i < questCount; i++){
    const type = questTypes[Math.floor(Math.random()*questTypes.length)];
    const rankIdx = w.quests[Math.floor(Math.random()*w.quests.length)];
    const isBoss = Math.random() < 0.2;
    const danger = RANKS.indexOf(rankIdx) + 1;
    const questEvent = (isBoss || Math.random() < 0.65) ? pickQuestEvent(world) : null;
    
    quests.push({
      id: `${world}-${i}-${Date.now()}-${Math.floor(Math.random()*99999)}`,
      name: `[${rankIdx}] ${type}: ${w.name}`,
      desc: `Venture into ${w.name}. ${isBoss?"Battle a legendary foe!":"Seek what lies within."}`,
      world: world,
      rank: rankIdx,
      danger: danger + (isBoss?2:0),
      reward: (50 + RANKS.indexOf(rankIdx)*60) * (isBoss?2:1),
      xp: (30 + RANKS.indexOf(rankIdx)*40) * (isBoss?1.5:1),
      turns: 8 + RANKS.indexOf(rankIdx)*2,
      boss: isBoss,
      loot: generateLootPool(world, rankIdx, isBoss),
      event: questEvent,
      eventChoice: null
    });
  }
  return quests;
}

function generateLootPool(world, rank, isBoss){
  const pool = [];
  const rarities = isBoss ? ["Rare", "Epic", "Epic"] : ["Common", "Magic", "Rare"];
  const rarity = rarities[Math.floor(Math.random()*rarities.length)];
  
  Object.entries(ITEM_DATABASE).forEach(([name, item]) => {
    if(item.world === world && item.rarity === rarity) pool.push(name);
  });
  
  return pool.length > 0 ? pool : Object.keys(ITEM_DATABASE).slice(0, 3);
}

function showQuestEvent(quest){
  if(!quest || !quest.event) return initiateCombat(quest);
  const event = quest.event;
  const choices = event.choices || [];
  if(choices.length === 0) return initiateCombat(quest);
  
  modal(`
    <h2>⚠️ ${event.title}</h2>
    <p class="story-text">${event.desc}</p>
    <div style="display:grid;gap:8px;margin-top:15px">
      ${choices.map((choice, idx) => `
        <button class="primary" onclick="chooseQuestEvent('${quest.id}', ${idx})">
          <b>${choice.text}</b>
          <div class="muted small" style="margin-top:4px">${choice.desc}</div>
        </button>
      `).join("")}
    </div>
  `);
}

function chooseQuestEvent(questId, choiceIdx){
  closeModal();
  let quest = globalQuests.find(q => q.id === questId);
  if(!quest || !quest.event || !quest.event.choices) return addLog("Event data not found.");
  
  const choice = quest.event.choices[choiceIdx];
  quest.eventChoice = choice;
  
  combatState.eventBonus = { effect: choice.effect || "none" };
  addLog(`<span class="blue">You chose: ${choice.text}</span>`);
  
  initiateCombat(quest);
}

function startQuestById(questId){
  closeModal();
  let quest = globalQuests.find(q => q.id === questId);
  if(!quest) return addLog("Quest not found.");
  if(quest.event && !quest.eventChoice) showQuestEvent(quest);
  else initiateCombat(quest);
}

function initiateCombat(quest){
  if(!quest){
    closeModal();
    addLog("<span class='bad'>Quest data missing. Try again from the board.</span>");
    render();
    return;
  }
  
  S.energy = Math.max(0, S.energy - Math.min(20, S.energy));
  
  const c = CLASSES[S.profession];
  const guildBonus = GUILDS[S.guild].bonus;
  const maxHp = c.hp + S.level*8 + (S.equipment.armor||0)*8 + (guildBonus.maxHp||0);
  
  const worldPool = BESTIARY[quest.world] || BESTIARY.forest;
  let enemyCount = quest.boss ? 1 : Math.max(1, Math.floor(quest.danger / 2));
  
  combatState = {
    active: true,
    quest: quest,
    player: {
      name: S.name,
      hp: maxHp, maxHp: maxHp,
      atk: c.atk + S.level*1.7 + (S.equipment.weapon||0)*2 + (guildBonus.atk||0),
      def: c.def + (S.equipment.armor||0)*2 + (guildBonus.def||0),
      spd: c.spd + S.stats.dex/5,
      mag: c.mag + S.level + (guildBonus.mag||0),
      crit: c.crit + (S.equipment.accessory||0) + S.stats.luck/10
    },
    enemyQueue: [],
    turn: 0,
    log: [],
    defenderStance: false,
    defenderCooldown: 0,
    eventBonus: combatState.eventBonus || {}
  };
  
  for(let i=0; i<enemyCount; i++){
    let baseE = quest.boss ? (BOSSES[quest.world] || BOSSES.forest) : worldPool[Math.floor(Math.random() * worldPool.length)];
    combatState.enemyQueue.push({
      ...baseE,
      hp: baseE.hp + S.rank*12 + Math.max(0, quest.danger-1)*4,
      maxHp: baseE.hp + S.rank*12 + Math.max(0, quest.danger-1)*4,
      atk: baseE.atk + S.rank * 1.5
    });
  }
  
  combatState.enemy = combatState.enemyQueue.shift();
  
  combatState.log.push(`<b>⚔️ Battle Initiated!</b>`);
  combatState.log.push(`You face: <b>${combatState.enemy.emoji} ${combatState.enemy.name}</b>`);
  combatState.log.push(`---`);
  
  renderCombatTurn();
}

function renderCombatTurn(){

function playerAction(action){
  const p = combatState.player;
  const e = combatState.enemy;
  combatState.turn++;
  
  let playerDamage = 0;
  let playerLog = "";
  let damageMultiplier = 1;
  let defenseBonus = 0;
  
  if(combatState.eventBonus && combatState.eventBonus.effect){
    if(combatState.eventBonus.effect === 'power') damageMultiplier = 1.15;
    if(combatState.eventBonus.effect === 'mana') damageMultiplier = 1.20;
    if(combatState.eventBonus.effect === 'defense') defenseBonus = 0.15;
  }
  
  switch(action){
    case 'attack':
      const crit = Math.random() * 100 < p.crit;
      playerDamage = Math.max(1, Math.round((p.atk - e.def * 0.55) * damageMultiplier));
      if(crit) playerDamage = Math.round(playerDamage * 1.5);
      e.hp -= playerDamage;
      playerLog = crit ? `<span class="crit-hit">💥 CRITICAL HIT!</span> You strike for <span class="damage-number">${playerDamage}</span>!` : `You attack! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
    case 'defend':
      combatState.defenderStance = true;
      combatState.defenderCooldown = 1;
      playerLog = `🛡️ You take a defensive stance! Defense +50% next turn.`;
      break;
    case 'spell':
      if(S.profession !== "Caster"){ playerLog = `You cannot cast spells!`; break; }
      playerDamage = Math.max(1, Math.round((p.mag * 1.8 - e.def * 0.3) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `✨ You cast a powerful spell! <span class="damage-number">${playerDamage}</span> arcane damage!`;
      break;
    case 'backstab':
      if(S.profession !== "Rogue"){ playerLog = `Only rogues can backstab!`; break; }
      playerDamage = Math.max(1, Math.round((p.atk * 1.8 - e.def * 0.4) * damageMultiplier));
      const backstabCrit = Math.random() * 100 < (p.crit + 20);
      if(backstabCrit) playerDamage = Math.round(playerDamage * 1.3);
      e.hp -= playerDamage;
      playerLog = backstabCrit ? `<span class="crit-hit">💀 LETHAL STRIKE!</span> <span class="damage-number">${playerDamage}</span> critical damage!` : `🗡️ You backstab for <span class="damage-number">${playerDamage}</span>!`;
      break;
    case 'power':
      if(S.profession !== "Fighter"){ playerLog = `That requires Fighter training!`; break; }
      playerDamage = Math.max(1, Math.round((p.atk * 2.2 - e.def * 0.3) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `💪 You unleash a devastating power attack! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
    case 'fortify':
      if(S.profession !== "Defender"){ playerLog = `That's a Defender ability!`; break; }
      combatState.defenderStance = true;
      combatState.defenderCooldown = 2;
      playerLog = `🏰 You fortify! Defense +75% for 2 turns!`;
      break;
    case 'ability':
      playerDamage = Math.max(1, Math.round((p.atk * 1.4 - e.def * 0.4) * damageMultiplier));
      e.hp -= playerDamage;
      playerLog = `⚡ You use your ability! <span class="damage-number">${playerDamage}</span> damage!`;
      break;
    case 'flee':
      if(Math.random() * 100 < (S.profession === "Rogue" ? 60 : 30)){
        combatState.log.push(`🏃 You successfully escape from battle!`);
        S.energy = Math.min(100, S.energy + 10);
        addLog("You fled from combat and recovered some energy.");
        save(); closeModal(); render(); return;
      } else playerLog = `🏃 Your escape attempt failed!`;
      break;
  }
  
  combatState.log.push(playerLog);
  
  if(e.hp <= 0){
    if(combatState.enemyQueue && combatState.enemyQueue.length > 0){
      combatState.log.push(`<span class="good">💀 ${e.name} falls! But another approaches...</span>`);
      combatState.enemy = combatState.enemyQueue.shift();
      combatState.log.push(`You now face: <b>${combatState.enemy.emoji} ${combatState.enemy.name}</b>`);
      renderCombatTurn();
      return;
    } else {
      finalizeCombat(true);
      return;
    }
  }
  
  if(Math.random() * 100 < 5){
    combatState.log.push(`${e.name} flees in terror!`);
    finalizeCombat(true); return;
  }
  
  let defenseReduction = 1 - defenseBonus;
  let enemyDamage = Math.max(1, Math.round((e.atk - (p.def * 0.45) * (1 + defenseBonus)) * defenseReduction));
  
  if(combatState.defenderStance && combatState.defenderCooldown > 0){
    enemyDamage = Math.round(enemyDamage * 0.25);
    combatState.defenderCooldown--;
    combatState.log.push(`🛡️ ${e.name}'s attack is deflected! <span class="damage-number">${enemyDamage}</span> damage`);
  } else if(Math.random() * 100 < (S.profession === "Rogue" ? 20 : 8)){
    combatState.log.push(`🛡️ You evade ${e.name}'s attack!`);
  } else {
    p.hp -= enemyDamage;
    combatState.log.push(`${e.name} attacks! <span class="damage-number">${enemyDamage}</span> damage to you!`);
  }
  
  combatState.defenderStance = false;
  
  if(p.hp <= 0) return finalizeCombat(false);
  renderCombatTurn();
}

function finalizeCombat(won){
  const quest = combatState.quest;
  const log = combatState.log;
  
  if(won){
    let bonus = quest.boss ? Math.round(quest.reward*1.8) : quest.reward;
    S.gold += bonus;
    gainXP(quest.xp);
    S.rp += quest.boss ? 28 : 12;
    S.quests++; S.wins++; S.profXp += Math.round(quest.xp*0.7);
    S.storyProgress += quest.boss ? 3 : 1;
    
    if(S.profXp >= S.profLevel*100 && S.profLevel < 10){
      S.profXp = 0; S.profLevel++;
      if(S.profLevel === 10){
        S.mastery++;
        addLog(`<span class="gold">🎖️ ${S.profession} MASTERY ACHIEVED!</span>`);
      } else addLog(`${S.profession} advanced to level ${S.profLevel}.`);
    }
    
    rankUp();
    
    if(quest.loot && quest.loot.length > 0 && Math.random() < (quest.boss ? 0.95 : 0.50)){
      const lootItem = quest.loot[Math.floor(Math.random()*quest.loot.length)];
      S.gear.push({...ITEM_DATABASE[lootItem], name: lootItem});
      log.push(`<span class="good">💎 LOOT FOUND: ${lootItem}</span>`);
    }
    
    log.push(`<span class="good">---</span>`);
    log.push(`<span class="good">✅ VICTORY!</span> Earned <span class="gold">${Math.round(bonus)}g</span>, <span class="blue">${Math.round(quest.xp)} XP</span>`);
    addLog(`<span class="good">Contract: ${quest.name} completed!</span>`);
  } else {
    S.losses++;
    const defeatXp = Math.round(quest.xp * 0.3);
    gainXP(defeatXp);
    log.push(`<span class="bad">---</span>`);
    log.push(`<span class="bad">❌ YOU WERE DEFEATED</span>`);
    log.push(`<span class="blue">Earned ${defeatXp} XP from the experience.</span>`);
    addLog(`<span class="bad">Contract failed... but you learned from it.</span>`);
  }
  
  const idx = globalQuests.findIndex(q => q.id === quest.id);
  if(idx !== -1) globalQuests.splice(idx, 1);
  
  save(); combatState.active = false;
  combatResultModal(quest, log, won);
}

  `);
}

function equipGear(i){
  let g = S.gear[i];
  if(g.slot === "weapon") S.equipment.weapon = g.atk;
  else if(g.slot === "armor") S.equipment.armor = g.def;
  else if(g.slot === "accessory") S.equipment.accessory = g.crit;
  S.gear.splice(i, 1);
  addLog(`Equipped: ${g.name}`);
  save(); render();
}

function sellGear(i){
  const g = S.gear[i];
  const price = g.rarity === 'Epic' ? 150 : g.rarity === 'Rare' ? 75 : g.rarity === 'Magic' ? 30 : 10;
  S.gold += price;
  addLog(`Sold ${g.name} for ${price}g.`);
  S.gear.splice(i, 1);
  save(); render();
}

function buyItem(name, cost, type, val){
  if(S.gold < cost) return addLog("<span class='bad'>Not enough gold.</span>");
  S.gold -= cost;
  if(type === 'hp') S.hp = Math.min(CLASSES[S.profession].hp + S.level*8, S.hp + val);
  if(type === 'energy') S.energy = Math.min(100, S.energy + val);
  addLog(`<span class="good">Bought ${name}.</span>`);
  save(); render();
}

function setProf(p){
  if(S.level < 3) return addLog("Professions unlock at Level 3.");
  S.profession = p; S.profLevel = 1; S.profXp = 0; S.unlockedAbilities = {};
  checkAbilityUnlocks(); addLog(`Profession changed to ${p}.`);
  save(); render();
}

function checkGuildRequirements(guildName){
  const req = GUILDS[guildName].req;
  return S.level >= req.level && S.rank >= req.rank && S.profession === req.class;
}

function joinGuild(guildName){
  if(!checkGuildRequirements(guildName)){
    const req = GUILDS[guildName].req;
    let unmet = [];
    if(S.level < req.level) unmet.push(`Level ${req.level}`);
    if(S.profession !== req.class) unmet.push(`${req.class} class`);
    if(S.rank < req.rank) unmet.push(`Rank ${req.rank}`);
    return addLog(`Cannot join ${guildName}. Requires: ${unmet.join(", ")}`);
  }
  S.guild = guildName;
  addLog(`<span class="purple">🎖️ Joined the ${guildName} guild!</span>`);
  save(); render();
}

    <div class="card">
      <h3>Save Management</h3>
      <button class="secondary" onclick="exportSave()" style="width:100%">📥 Export Save</button>
      <p class="muted small" style="margin-top:10px">Your progress is automatically saved to your browser.</p>
    </div>
    <div class="card">
      <h3>Statistics</h3>
      <div class="grid">
        <div class="stat"><span>Total Levels</span><b>${S.level}</b></div>
        <div class="stat"><span>Battles Won</span><b class="good">${S.wins}</b></div>
        <div class="stat"><span>Battles Lost</span><b class="bad">${S.losses}</b></div>
        <div class="stat"><span>Professions Mastered</span><b>${S.mastery}</b></div>
      </div>
    </div>
    <div class="card">
      <button class="secondary" onclick="reset()" style="width:100%;color:var(--bad)">🔄 Reset Save</button>
    </div>
  `;
}

let tab = "guild";

function render(){
  const names = {
    guild: "🏛️ Guild",
    quests: "⚔️ Quests",
    world: "🗺️ World",
    party: "⚗️ Classes",
    guilds: "🎖️ Guilds",
    inventory: "🎒 Items",
    store: "⚖️ Store",
    story: "📖 Story",
    settings: "⚙️ Settings"
  };
  
  document.getElementById("topSub").textContent = `${RANKS[S.rank]}-Rank • ${S.gold}g • 💪 ${S.level}`;
  
  const views = {
    guild: guild, quests: quests, world: world, party: party,
    guilds: guilds, inventory: inventory, store: store,
    story: story, settings: settings
  };
  
  document.getElementById("view").innerHTML = views[tab]();
  
  document.getElementById("tabs").innerHTML = Object.keys(names).map(k => 
    `<button class="${tab===k?"active":""}" onclick="tab='${k}';render()">${names[k]}</button>`
  ).join("");
}

// Initialize game
if(!localStorage.getItem("tag-enhanced-started")){
  createCharacter();
  localStorage.setItem("tag-enhanced-started", "true");
} else render();
</script>
</body>
</html>
